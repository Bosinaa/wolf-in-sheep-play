ask.ask.access.q":"What data did you have access to?","case.d1c4.ask.ask.access.a":"To production, to all two hundred stores. They gave me the login on day one","case.d1c4.ask.ask.access.tag":"tech","case.d1c4.ask.ask.hard.q":"Which of your mistakes cost money?","case.d1c4.ask.ask.hard.a":"I've never had any. I always double-checked everything several times","case.d1c4.ask.ask.hard.tag":"awkward","case.d1c4.ask.ask2.dash.q":"How did you build a dashboard across 200 stores?","case.d1c4.ask.ask2.dash.a":"I exported a table and made pivots in Power BI. Refreshed it by hand every morning","case.d1c4.ask.ask2.dash.tag":"tech","case.d1c4.ask.ask2.file.q":"The author in your file's properties is «user». Why?","case.d1c4.ask.ask2.file.a":"I installed Power BI on the work laptop, the account there isn't signed. The file is mine","case.d1c4.ask.ask2.file.tag":"authorship","case.d1c4.ask.ask2.money.q":"150 thousand for an intern-level role — why?","case.d1c4.ask.ask2.money.a":"I bring savings in the tens of millions. That's a fair price","case.d1c4.ask.ask2.money.tag":"money","case.d1c4.ask.ask2.next.q":"Why did you leave Mercury?","case.d1c4.ask.ask2.next.a":"The internship ended, they didn't extend it. They said it was the budget","case.d1c4.ask.ask2.next.tag":"motivation","case.d1c4.cue.0":"names the savings figure first","case.d1c4.cue.1":"answers the access question instantly","case.d1c4.contra.cv.intern|ed.school.note":"June to August 2025 he is simultaneously on a full-time internship in the Moscow office and at a residential offline intensive in Innopolis. Two full-time commitments on the same dates (protocol 1)","case.d1c4.contra.cv.intern|ref.term.note":"The résumé says a full-day internship from June to December, the supervisor says September–December at 20 hours a week. Both the dates and the scope are stretched (protocol 1)","case.d1c4.contra.iv.access|ref.scope.note":"He claims access to production data for all 200 stores, while the supervisor writes that interns only ever work on a demo extract (protocol 4)","case.d1c4.contra.ask.access|ref.scope.note":"In his answer he repeats the claim of access to every store from day one — the supervisor's letter says demo extract (protocol 4)","case.d1c4.contra.ask.summer|ed.school.note":"He explains it himself: «mornings there, evenings here» — a residential school in Innopolis and a Moscow office on the same dates (protocol 1)","case.d1c5.name":"Danil Yershov, 25","case.d1c5.channelTitle":"INTERVIEW · 12:50","case.d1c5.feedbackCorrect":"A boring, honest résumé. The employment letter is genuine and the answer about the 502 goes in order rather than by guesswork: this is the person who fixes production at four in the morning without panicking","case.d1c5.feedbackWrong":"You rejected him for an empty GitHub and no references. For precisely what the protocol names as not a mismatch","case.d1c5.metaKey.Позиция":"Position","case.d1c5.metaKey.Стаж заявлен":"Claimed experience","case.d1c5.metaVal.Стаж заявлен":"2 years (government contract)","case.d1c5.metaKey.Ожидания":"Expectations","case.d1c5.metaKey.Источник":"Source","case.d1c5.metaVal.Источник":"applied directly","case.d1c5.doc.Резюме.tab":"Résumé","case.d1c5.doc.Резюме.note":"dry, no adjectives","case.d1c5.doc.Резюме.f.cv.job.label":"Job","case.d1c5.doc.Резюме.f.cv.job.value":"support engineer, Vektor Research Institute, August 2024 — now","case.d1c5.doc.Резюме.f.cv.nda.label":"Projects","case.d1c5.doc.Резюме.f.cv.nda.value":"«can't describe them, the site is classified; happy to solve tasks on the spot»","case.d1c5.doc.Резюме.f.cv.stack.label":"Stack","case.d1c5.doc.Образование.tab":"Education","case.d1c5.doc.Образование.f.ed.uni.label":"University","case.d1c5.doc.Образование.f.ed.uni.value":"telecom college (2021) + evening bachelor's, 4th year","case.d1c5.doc.Образование.f.ed.form.label":"Format","case.d1c5.doc.Образование.f.ed.form.value":"part-time evening, classes after 19:00","case.d1c5.doc.Портфолио.tab":"Portfolio","case.d1c5.doc.Портфолио.f.pf.git.value":"3 repositories, last commit 8 months ago","case.d1c5.doc.Портфолио.f.pf.night.label":"Commit times","case.d1c5.doc.Портфолио.f.pf.night.value":"01:00 — 04:00 local time","case.d1c5.doc.Портфолио.f.pf.what.label":"What's in the repositories","case.d1c5.doc.Портфолио.f.pf.what.value":"Ansible playbooks for a home server, neat READMEs","case.d1c5.doc.Рекомендации.tab":"References","case.d1c5.doc.Рекомендации.f.ref.none.label":"Available","case.d1c5.doc.Рекомендации.f.ref.none.value":"none: «it isn't done at the site, my boss won't sign one»","case.d1c5.doc.Рекомендации.f.ref.doc.label":"Instead of a reference","case.d1c5.doc.Рекомендации.f.ref.doc.value":"an employment letter with title and dates, signed and stamped","case.d1c5.doc.Рекомендации.f.ref.check.label":"Letter verification","case.d1c5.doc.Рекомендации.f.ref.check.value":"institute HR: support engineer, August 2024 — to date, staff number 4417","case.d1c5.probe.pr.hr.label":"Verify the employment letter","case.d1c5.probe.pr.hr.result":"The institute's HR confirmed the letter is genuine: title, dates and staff number all match. They give no character reference by phone — security rules","case.d1c5.tr.0.text":"The candidate joined from a phone, apologised for the connection","case.d1c5.tr.1.text":"There's almost no public code: nothing I do at work can leave the site. I can solve any task you like on your own machine","case.d1c5.tr.iv.night.text":"No, that's at home. Work in the day, classes in the evening, my own things at night. I don't sleep much, I know that's nothing to brag about","case.d1c5.ask.ask.night.q":"Night commits — is that work in another time zone?","case.d1c5.ask.ask.night.a":"No, that's at home. Shift during the day, classes in the evening, my own things at night. I know the schedule is bad, but nobody else's hours are in there","case.d1c5.ask.ask.night.tag":"awkward","case.d1c5.ask.ask.nda.q":"Since you can't show the code — tell me what you automated","case.d1c5.ask.ask.nda.a":"Standing up the test rig: it used to be twenty manual steps, now it's one playbook. The script stayed on site, I can't take it with me","case.d1c5.ask.ask.nda.tag":"experience","case.d1c5.ask.ask.tech.q":"A service returns 502. Your first three steps?","case.d1c5.ask.ask.tech.a":"I check whose 502 it is — the balancer's or the upstream's. Logs, whether the backends are alive, the healthcheck. Then resources and timeouts","case.d1c5.ask.ask.tech.tag":"tech","case.d1c5.ask.ask.ref.q":"Can anyone from the site confirm what you're saying?","case.d1c5.ask.ask.ref.a":"Only HR and only the dry facts: title and dates. Security rules don't allow a character reference, so I attached the letter","case.d1c5.ask.ask.ref.tag":"references","case.d1c5.ask.ask2.ansible.q":"Why is a playbook better than a bash script?","case.d1c5.ask.ask2.ansible.a":"Idempotency: running it again doesn't break what's already configured. With bash I had to check that by hand every time","case.d1c5.ask.ask2.ansible.tag":"tech","case.d1c5.ask.ask2.money.q":"110 thousand — why that number?","case.d1c5.ask.ask2.money.a":"I based it on junior infrastructure postings and subtracted the lack of production cloud experience","case.d1c5.ask.ask2.money.tag":"money","case.d1c5.ask.ask2.sleep.q":"You sleep four hours a night. Is that long-term?","case.d1c5.ask.ask2.sleep.a":"No. My degree is done in June, after that it gets normal. I understand you can't work like this for long","case.d1c5.ask.ask2.sleep.tag":"awkward","case.d1c5.ask.ask2.leave.q":"Why are you leaving a classified site?","case.d1c5.ask.ask2.leave.a":"There's nothing to learn there: the same rig for ten years. I want to work where other people read my code","case.d1c5.ask.ask2.leave.tag":"motivation","case.d1c5.cue.0":"speaks slowly, as if tired","case.d1c5.cue.1":"not a single loud word about himself","case.d1c5.herring.0":"No references and no public code — a classified site, which the protocol explicitly names as not a mismatch","case.d1c5.herring.1":"Night commits look like «worked in another time zone», but are explained by evening classes","case.d1c5.herring.2":"A GitHub dead for eight months: he doesn't do pet projects, he works under NDA","case.d2c1.name":"Oleg Barsov, 31","case.d2c1.channelTitle":"INTERVIEW · 09:50","case.d2c1.feedbackCorrect":"Eleven years of experience turned out to be four years as a grade-1 engineer. The former employer's tech sheet is the dullest and deadliest document in the file","case.d2c1.feedbackWrong":"You passed him along as a staff engineer at 420 thousand, and nobody re-reads his résumé at the technical round. The first architecture review will collapse, and the blame will fall on whoever «misunderstood»","case.d2c1.metaKey.Позиция":"Position","case.d2c1.metaKey.Стаж заявлен":"Claimed experience","case.d2c1.metaVal.Стаж заявлен":"10 years","case.d2c1.metaKey.Ожидания":"Expectations","case.d2c1.metaKey.Источник":"Source","case.d2c1.metaVal.Источник":"applied directly","case.d2c1.doc.Резюме.tab":"Résumé","case.d2c1.doc.Резюме.note":"six pages, achievements in large type","case.d2c1.doc.Резюме.f.cv.k8s.label":"Key experience","case.d2c1.doc.Резюме.f.cv.k8s.value":"Pirs LLC, 2013 — 2019: ran production Kubernetes clusters","case.d2c1.doc.Резюме.f.cv.lead.label":"Role","case.d2c1.doc.Резюме.f.cv.lead.value":"team lead of 9 people, 2019 — 2023","case.d2c1.doc.Резюме.f.cv.stack.label":"Stack","case.d2c1.doc.Справка с работы.tab":"Employment letter","case.d2c1.doc.Справка с работы.note":"a copy, the stamp is legible","case.d2c1.doc.Справка с работы.f.sp.pos.label":"Title on the letter","case.d2c1.doc.Справка с работы.f.sp.pos.value":"software engineer, grade 1, no direct reports","case.d2c1.doc.Справка с работы.f.sp.term.label":"Period","case.d2c1.doc.Справка с работы.f.sp.term.value":"April 2019 — February 2023","case.d2c1.doc.Справка с работы.f.sp.note.label":"Note","case.d2c1.doc.Справка с работы.f.sp.note.value":"no management allowance was ever paid","case.d2c1.doc.Техкарта «Пирса».tab":"Pirs tech sheet","case.d2c1.doc.Техкарта «Пирса».note":"systems record, sent by the former employer at the company's request","case.d2c1.doc.Техкарта «Пирса».f.tk.stack.label":"Infrastructure before 2017","case.d2c1.doc.Техкарта «Пирса».f.tk.stack.value":"bare metal + Ansible, no containers","case.d2c1.doc.Техкарта «Пирса».f.tk.k8s.value":"rollout began in 2018, production from mid-2019","case.d2c1.doc.Техкарта «Пирса».f.tk.load.label":"Service peak load","case.d2c1.doc.Техкарта «Пирса».f.tk.load.value":"about 300 requests per second","case.d2c1.doc.Рекомендации.tab":"References","case.d2c1.doc.Рекомендации.f.ref.who.label":"Who","case.d2c1.doc.Рекомендации.f.ref.who.value":"colleague at Pirs, A. Tyurin","case.d2c1.doc.Рекомендации.f.ref.text.label":"Reference","case.d2c1.doc.Рекомендации.f.ref.text.value":"«solid engineer, likes to argue, but writes clean code»","case.d2c1.probe.pr.tk.label":"Ask Pirs about the team composition 2019–2023","case.d2c1.probe.pr.tk.result":"Reply: the service team was 4 developers, group lead A. V. Tyurin. O. Barsov was never listed in a management role","case.d2c1.probe.pr.tk.evidence":"Pirs: the group was led by Tyurin, not Barsov","case.d2c1.tr.0.text":"The candidate opens with a four-minute monologue","case.d2c1.tr.1.text":"I've been in this industry eleven years. Clusters, leadership, architecture — I've done it all, I can cover any role","case.d2c1.tr.2.text":"What load did your service handle?","case.d2c1.tr.iv.rps.text":"Forty thousand requests per second per instance, no degradation. We held that on a single node","case.d2c1.tr.4.text":"Since which year has Kubernetes been in production for you?","case.d2c1.tr.iv.year.text":"Since thirteen. We were among the first in the country to bring it up, before all those fashionable operators","case.d2c1.ask.ask.load.q":"Forty thousand requests per second — measured on what?","case.d2c1.ask.ask.load.a":"In production, from the graphs. I don't remember the exact dashboard, but the number held steady, I reported it to management","case.d2c1.ask.ask.load.tag":"numbers","case.d2c1.ask.ask.lead.q":"How many people reported to you and who hired them?","case.d2c1.ask.ask.lead.a":"Nine. I didn't hire them, but I assigned the tasks, so effectively I led them","case.d2c1.ask.ask.lead.tag":"team","case.d2c1.ask.ask.k8s.q":"What did your first cluster look like back in 2013?","case.d2c1.ask.ask.k8s.a":"Three servers, we installed Kubernetes and started the services. It was rare back then, we were ahead of the market","case.d2c1.ask.ask.k8s.tag":"tech","case.d2c1.ask.ask.fail.q":"Tell me about an outage you caused","case.d2c1.ask.ask.fail.a":"There were no outages through my fault. There were other people's mistakes that I cleaned up","case.d2c1.ask.ask.fail.tag":"awkward","case.d2c1.ask.ask2.arch.q":"How did you split the monolith into services?","case.d2c1.ask.ask2.arch.a":"By chunks of code: whatever was logically separate, I pulled out. I didn't draw diagrams, I kept it in my head","case.d2c1.ask.ask2.arch.tag":"tech","case.d2c1.ask.ask2.kafka.q":"Why was there Kafka in your project?","case.d2c1.ask.ask2.kafka.a":"For queues. We installed it because all the big players do, and mostly it sat there with no load","case.d2c1.ask.ask2.kafka.tag":"tech","case.d2c1.ask.ask2.money.q":"420 thousand — where does that number come from?","case.d2c1.ask.ask2.money.a":"From the market rate for staff level. Eleven years of experience costs more, I applied at 500 too","case.d2c1.ask.ask2.money.tag":"money","case.d2c1.ask.ask2.ref.q":"Who at Pirs can confirm your lead role?","case.d2c1.ask.ask2.ref.a":"Tyurin, a colleague. He'll confirm I ran the area, even though it was never made formal","case.d2c1.ask.ask2.ref.tag":"references","case.d2c1.cue.0":"tells everything in the first person","case.d2c1.cue.1":"gets emotional when asked to be specific","case.d2c1.contra.cv.k8s|tk.k8s.note":"Résumé: production Kubernetes clusters at Pirs since 2013. Pirs's own tech sheet: no containers before 2017, Kubernetes in production only from mid-2019 (protocols 2 and 3)","case.d2c1.contra.cv.lead|sp.pos.note":"The résumé says team lead of nine, the letter from that same job says grade-1 engineer with no reports and no management allowance (protocol 4)","case.d2c1.contra.iv.rps|tk.load.note":"In the interview it's 40,000 requests per second per instance; the tech sheet puts the whole service's peak load at about 300 (protocol 4)","case.d2c1.contra.iv.year|tk.stack.note":"He confirms it out loud: Kubernetes «since thirteen». The infrastructure before 2017 was bare metal with no containers (protocol 2)","case.d2c1.contra.ask.k8s|tk.stack.note":"He describes «the first cluster in 2013», while before 2017 the company ran bare metal with no containers at all (protocols 2 and 3)","case.d2c1.contra.ask.lead|sp.pos.note":"«Nine reports, though I didn't hire them» against the letter: grade-1 engineer with no reports (protocol 4)","case.d2c2.name":"Polina Vereshchagina, 29","case.d2c2.channelTitle":"INTERVIEW · 10:40","case.d2c2.feedbackCorrect":"Three «mismatches» in a row, and all three are ordinary life: a marriage, a company renaming, parental leave. Not one pair here holds — and that's how it should be","case.d2c2.feedbackWrong":"You rejected someone for a maiden name and a company renaming. This is the very case that point nine of the protocol was written for","case.d2c2.metaKey.Позиция":"Position","case.d2c2.metaKey.Стаж заявлен":"Claimed experience","case.d2c2.metaVal.Стаж заявлен":"6 years (with a break)","case.d2c2.metaKey.Ожидания":"Expectations","case.d2c2.metaKey.Источник":"Source","case.d2c2.metaVal.Источник":"referred by an employee","case.d2c2.doc.Резюме.tab":"Résumé","case.d2c2.doc.Резюме.f.cv.job.label":"Job","case.d2c2.doc.Резюме.f.cv.job.value":"Trakt LLC, data engineer, 2018 — 2024","case.d2c2.doc.Резюме.f.cv.gap.label":"Break","case.d2c2.doc.Резюме.f.cv.gap.value":"March 2022 — September 2023, parental leave","case.d2c2.doc.Резюме.f.cv.stack.label":"Stack","case.d2c2.doc.Образование.tab":"Education","case.d2c2.doc.Образование.note":"a copy of the diploma","case.d2c2.doc.Образование.f.ed.name.label":"Name on the diploma","case.d2c2.doc.Образование.f.ed.name.value":"Sokolova Polina Andreyevna","case.d2c2.doc.Образование.f.ed.uni.label":"University on the diploma","case.d2c2.doc.Образование.f.ed.uni.value":"Strela State Technical University (now Strela Technical University)","case.d2c2.doc.Образование.f.ed.year.label":"Year","case.d2c2.doc.Образование.f.ed.year.value":"2018, applied mathematics","case.d2c2.doc.Выписка ЕГРЮЛ.tab":"Company register record","case.d2c2.doc.Выписка ЕГРЮЛ.f.eg.name.label":"Name by tax ID","case.d2c2.doc.Выписка ЕГРЮЛ.f.eg.name.value":"Trakt LLC (formerly Delta-Inform LLC)","case.d2c2.doc.Выписка ЕГРЮЛ.f.eg.reg.label":"Registration date","case.d2c2.doc.Выписка ЕГРЮЛ.f.eg.rename.label":"Name change","case.d2c2.doc.Рекомендации.tab":"References","case.d2c2.doc.Рекомендации.f.ref.who.label":"Who","case.d2c2.doc.Рекомендации.f.ref.who.value":"head of the Trakt data platform, I. Mokhov","case.d2c2.doc.Рекомендации.f.ref.text.label":"Reference","case.d2c2.doc.Рекомендации.f.ref.text.value":"«went on parental leave and came back to the same project, closed the dbt migration in six months»","case.d2c2.doc.Рекомендации.f.ref.dates.label":"Period","case.d2c2.doc.Рекомендации.f.ref.dates.value":"2018 — 2024, with a break in 2022–2023","case.d2c2.doc.Рекомендации.f.ref.name.label":"About the surname","case.d2c2.doc.Рекомендации.f.ref.name.value":"«married in 2019, her documents said Sokolova»","case.d2c2.probe.pr.ref.label":"Call the head of the platform","case.d2c2.probe.pr.ref.result":"Mokhov: «Polina Vereshchagina, Sokolova before her marriage. Same person, six years together. There was parental leave, she came back to the project, she carried the migration»","case.d2c2.tr.0.text":"The candidate joined on time, camera on","case.d2c2.tr.1.text":"Let me say it up front: my diploma is in my maiden name, and the company was renamed in the meantime. It looks like a mess, but it's one and the same job","case.d2c2.tr.iv.dbt.text":"Airflow is about scheduling and dependencies, dbt is about transformations and data tests. We ran them together: the DAG starts the model, tests fail — an alert fires","case.d2c2.tr.3.text":"A year and a half away — how did you come back?","case.d2c2.tr.4.text":"It took a month to catch up on the changes through commits and docs. The stack hadn't run as far ahead as people like to warn","case.d2c2.ask.ask.name.q":"The diploma has a different surname — explain","case.d2c2.ask.ask.name.a":"Sokolova is my maiden name. I married in nineteen, the diploma is from eighteen. I can bring the certificate","case.d2c2.ask.ask.name.tag":"documents","case.d2c2.ask.ask.gap.q":"How did you return after parental leave?","case.d2c2.ask.ask.gap.a":"For a month I read commits and docs to see what had changed. The first two weeks I worked slowly and said so out loud","case.d2c2.ask.ask.gap.tag":"awkward","case.d2c2.ask.ask.tech.q":"Why dbt if you already have Airflow?","case.d2c2.ask.ask.tech.a":"Airflow is scheduling, dbt is transformations and data tests. The DAG runs the model, a test fails — an alert arrives","case.d2c2.ask.ask.tech.tag":"tech","case.d2c2.ask.ask.rename.q":"The company name in the register doesn't match your résumé","case.d2c2.ask.ask.rename.a":"Delta-Inform was renamed to Trakt in twenty-one. Same tax ID, it's right there one line below in the record","case.d2c2.ask.ask.rename.tag":"documents","case.d2c2.ask.ask2.spark.q":"When is Spark unnecessary?","case.d2c2.ask.ask2.spark.a":"When the data fits in one machine's memory. I later rewrote half our jobs in plain Python — it got faster","case.d2c2.ask.ask2.spark.tag":"tech","case.d2c2.ask.ask2.money.q":"290 thousand — how did you arrive at that?","case.d2c2.ask.ask2.money.a":"From data engineer postings with my stack, minus the year I spent away from streaming","case.d2c2.ask.ask2.money.tag":"money","case.d2c2.ask.ask2.team.q":"What did you do when you disagreed with the team's decision?","case.d2c2.ask.ask2.team.a":"Once I argued about a storage schema for two weeks. I turned out to be wrong, we kept theirs — it was simpler","case.d2c2.ask.ask2.team.tag":"team","case.d2c2.ask.ask2.leave.q":"Why are you leaving Trakt?","case.d2c2.ask.ask2.leave.a":"The migration is finished, from here it's maintenance. I'd rather build than maintain","case.d2c2.ask.ask2.leave.tag":"motivation","case.d2c2.cue.0":"explained the discrepancies in her documents before being asked","case.d2c2.cue.1":"the dbt answer is at a practitioner's level, not a course's","case.d2c2.herring.0":"A different surname on the diploma — married in 2019, confirmed by the reference (protocol 9)","case.d2c2.herring.1":"The company name in the register doesn't match the résumé — renamed in 2021, same tax ID","case.d2c2.herring.2":"A year and a half of parental leave — the protocol names this explicitly as not grounds for rejection","case.d2c2.herring.3":"The dates in the résumé and from the reference match down to the break","case.d2c3.name":"Artyom Kuliev, 26","case.d2c3.channelTitle":"INTERVIEW · 11:25","case.d2c3.feedbackCorrect":"The factory's first product: a lookalike company named after ours, a reference on his own phone number, and a portfolio uploaded in a single evening","case.d2c3.feedbackWrong":"He's inside — and he isn't alone. In two weeks he'll bring along «a strong engineer I know» with a reference from the same Lanskoy","case.d2c3.metaKey.Позиция":"Position","case.d2c3.metaKey.Стаж заявлен":"Claimed experience","case.d2c3.metaVal.Стаж заявлен":"5 years","case.d2c3.metaKey.Ожидания":"Expectations","case.d2c3.metaKey.Источник":"Source","case.d2c3.metaVal.Источник":"applied directly","case.d2c3.doc.Резюме.tab":"Résumé","case.d2c3.doc.Резюме.note":"four pages, tidy layout","case.d2c3.doc.Резюме.f.cv.company.label":"Job","case.d2c3.doc.Резюме.f.cv.company.value":"Otara-Tech LLC, senior backend, 2021 — 2024","case.d2c3.doc.Резюме.f.cv.senior.label":"Level","case.d2c3.doc.Резюме.f.cv.senior.value":"senior Python, 5 years in production, mentored juniors","case.d2c3.doc.Резюме.f.cv.phone.label":"Contact phone","case.d2c3.doc.Проверка домена.tab":"Domain check","case.d2c3.doc.Проверка домена.note":"automatic report from the security team","case.d2c3.doc.Проверка домена.f.dm.whois.label":"Domain otaratech.ru","case.d2c3.doc.Проверка домена.f.dm.whois.value":"registered 11 months ago, owner private","case.d2c3.doc.Проверка домена.f.dm.egrul.label":"Company register by name","case.d2c3.doc.Проверка домена.f.dm.egrul.value":"Otara-Tech LLC registered 17.05.2023","case.d2c3.doc.Проверка домена.f.dm.note.label":"Security note","case.d2c3.doc.Проверка домена.f.dm.note.value":"the name and domain resemble our company but have no connection to it","case.d2c3.doc.Рекомендации.tab":"References","case.d2c3.doc.Рекомендации.f.ref.who.label":"Who","case.d2c3.doc.Рекомендации.f.ref.who.value":"manager, Viktor Lanskoy","case.d2c3.doc.Рекомендации.f.ref.phone.label":"Reference's phone","case.d2c3.doc.Рекомендации.f.ref.text.label":"Reference","case.d2c3.doc.Рекомендации.f.ref.text.value":"«systematically closed growth areas, grew into a strong engineer»","case.d2c3.doc.Портфолио.tab":"Portfolio","case.d2c3.doc.Портфолио.f.pf.git.value":"account created 4 months ago, 11 repositories","case.d2c3.doc.Портфолио.f.pf.commits.label":"Commits","case.d2c3.doc.Портфолио.f.pf.commits.value":"all repositories uploaded on the same day, one «init» commit each","case.d2c3.probe.pr.call.label":"Call the reference, Lanskoy","case.d2c3.probe.pr.call.result":"The same man's voice as yesterday for another candidate. «Artyom? Strong specialist, full cycle». Couldn't name the product","case.d2c3.probe.pr.call.evidence":"a man's voice, café noise; asked about the product, he answers «he did everything, the full cycle»","case.d2c3.tr.0.text":"The candidate answers evenly, as if reading from a sheet","case.d2c3.tr.1.text":"Five years in production, senior. Systematically closed growth areas in the team, mentored juniors","case.d2c3.tr.2.text":"What is the GIL and when does it get in the way?","case.d2c3.tr.iv.gil.text":"The GIL is a library for multithreading, you plug it in when you need to speed up code. We installed it with pip","case.d2c3.tr.4.text":"Which number is best for reaching your manager?","case.d2c3.tr.iv.phone.text":"The one in the résumé. He's always around, he'll pick up right away","case.d2c3.ask.ask.gil.q":"What does the GIL do and when does it get in the way?","case.d2c3.ask.ask.gil.a":"It's a multithreading library, installed via pip. It gets in the way if you don't plug it in","case.d2c3.ask.ask.gil.tag":"tech","case.d2c3.ask.ask.ref.q":"What number should I call for your manager?","case.d2c3.ask.ask.ref.a":"The one in the résumé. He's always around, he'll pick up right away","case.d2c3.ask.ask.ref.tag":"references","case.d2c3.ask.ask.company.q":"What is Otara-Tech? The name is close to ours","case.d2c3.ask.ask.company.a":"Coincidence. We worked in the same market, that's why the names are similar","case.d2c3.ask.ask.company.tag":"documents","case.d2c3.ask.ask.repo.q":"Why were all the repositories uploaded on the same day?","case.d2c3.ask.ask.repo.a":"I moved them from my old account and deleted it. The history didn't survive, but the code is mine","case.d2c3.ask.ask.repo.tag":"awkward","case.d2c3.ask.ask2.async.q":"How does asyncio differ from threads?","case.d2c3.ask.ask2.async.a":"asyncio is faster because it's asynchronous. Threads are slow, better not to use them","case.d2c3.ask.ask2.async.tag":"tech","case.d2c3.ask.ask2.mentor.q":"Whom did you mentor and what did you teach them?","case.d2c3.ask.ask2.mentor.a":"Two juniors. I taught them to write clean code and systematically close growth areas","case.d2c3.ask.ask2.mentor.tag":"team","case.d2c3.ask.ask2.money.q":"350 thousand — justify it","case.d2c3.ask.ask2.money.a":"Senior with five years. I can bring more if you give me architecture","case.d2c3.ask.ask2.money.tag":"money","case.d2c3.ask.ask2.leave.q":"Why did you leave Otara-Tech?","case.d2c3.ask.ask2.leave.a":"The project was shut down, the investor walked. It all happened very fast","case.d2c3.ask.ask2.leave.tag":"motivation","case.d2c3.cue.0":"talks willingly, in a lot of generalities","case.d2c3.cue.1":"answers the phone-number question faster than he needs to","case.d2c3.contra.cv.company|dm.egrul.note":"The résumé claims work at Otara-Tech since 2021, but the company was registered on 17.05.2023 — and its domain is only 11 months old (protocol 3)","case.d2c3.contra.cv.phone|ref.phone.note":"The candidate's phone number and his «manager's» are one and the same. A reference is a document too (protocol 7)","case.d2c3.contra.cv.senior|iv.gil.note":"He claims senior Python with five years in production, yet calls the GIL a library you install with pip (protocol 5)","case.d2c3.contra.cv.senior|pf.commits.note":"Five years in production against an account four months old where every repository was uploaded on one day with a single «init» commit (protocol 6)","case.d2c3.contra.ask.gil|cv.senior.note":"He calls the GIL a pip library — that isn't the level of a senior Python developer with five years in production (protocol 5)","case.d2c3.contra.ask.company|dm.egrul.note":"«A coincidence of names» doesn't explain why the company was registered in 2023 while the claimed experience starts in 2021 (protocol 3)","case.d2c4.name":"Sergey Don, 38","case.d2c4.channelTitle":"INTERVIEW · 12:30","case.d2c4.feedbackCorrect":"Cheap, quiet and real. The answer about the query plan is worth more than three pages of achievements — and it's exactly this kind of résumé that gets rejected «on instinct»","case.d2c4.feedbackWrong":"You rejected a DBA with fourteen years of practice for asking too little and not keeping a GitHub. The complaint will be justified","case.d2c4.metaKey.Позиция":"Position","case.d2c4.metaKey.Стаж заявлен":"Claimed experience","case.d2c4.metaVal.Стаж заявлен":"13 years","case.d2c4.metaKey.Ожидания":"Expectations","case.d2c4.metaVal.Ожидания":"260 000 ₽ (below market)","case.d2c4.metaKey.Источник":"Source","case.d2c4.metaVal.Источник":"applied directly","case.d2c4.doc.Резюме.tab":"Résumé","case.d2c4.doc.Резюме.note":"one page, default font","case.d2c4.doc.Резюме.f.cv.job.label":"Job","case.d2c4.doc.Резюме.f.cv.job.value":"Stal-Invest, DBA, 2011 — January 2025","case.d2c4.doc.Резюме.f.cv.gap.label":"Now","case.d2c4.doc.Резюме.f.cv.gap.value":"out of work since February 2025, department cut","case.d2c4.doc.Резюме.f.cv.money.label":"Expectations","case.d2c4.doc.Резюме.f.cv.money.value":"260 000 ₽, «I know that's below market»","case.d2c4.doc.Документы.tab":"Documents","case.d2c4.doc.Документы.f.dc.order.label":"Copy of the order","case.d2c4.doc.Документы.f.dc.order.value":"staff reduction, 31.01.2025, IT operations department","case.d2c4.doc.Документы.f.dc.book.label":"Employment record","case.d2c4.doc.Документы.f.dc.book.value":"one entry in 14 years: hired 2011, released 2025","case.d2c4.doc.Документы.f.dc.egrul.label":"Company register","case.d2c4.doc.Документы.f.dc.egrul.value":"Stal-Invest registered 1998, still active","case.d2c4.doc.Портфолио.tab":"Portfolio","case.d2c4.doc.Портфолио.f.pf.git.value":"no account","case.d2c4.doc.Портфолио.f.pf.what.label":"What he shows","case.d2c4.doc.Портфолио.f.pf.what.value":"a text file with query plans before and after optimisation, his own comments","case.d2c4.doc.Портфолио.f.pf.conf.label":"Public work","case.d2c4.doc.Портфолио.f.pf.conf.value":"spoke at an internal meetup, no recording","case.d2c4.doc.Рекомендации.tab":"References","case.d2c4.doc.Рекомендации.f.ref.who.label":"Who","case.d2c4.doc.Рекомендации.f.ref.who.value":"former head of operations, R. Gizatullin","case.d2c4.doc.Рекомендации.f.ref.text.label":"Reference","case.d2c4.doc.Рекомендации.f.ref.text.value":"«13 years without a single data loss; when the department was cut I called him to apologise»","case.d2c4.doc.Рекомендации.f.ref.check.label":"Follow-up on the call","case.d2c4.doc.Рекомендации.f.ref.check.value":"confirmed the order, the title, and that he ran the databases alone","case.d2c4.probe.pr.ref.label":"Call the former manager","case.d2c4.probe.pr.ref.result":"Gizatullin: «The whole department was cut, not his fault. He held four clusters alone, handled night incidents himself. Hire him»","case.d2c4.tr.0.text":"The candidate answers briefly, pauses before each answer","case.d2c4.tr.1.text":"I have no public portfolio. Fourteen years in one place looks boring, I know","case.d2c4.tr.iv.plan.text":"First the execution plan and the statistics: are they stale, has an index gone off. Then locks and table bloat. Guessing is pointless, it's all in the plan","case.d2c4.ask.ask.money.q":"Why are you asking below market?","case.d2c4.ask.ask.money.a":"Thirty-eight, a mortgage and six months without work. I need a job, not a win at the negotiating table","case.d2c4.ask.ask.money.tag":"money","case.d2c4.ask.ask.tech.q":"A query suddenly became slow. What do you do?","case.d2c4.ask.ask.tech.a":"Execution plan and statistics: are they stale, has an index gone off. Then locks and table bloat. Guessing is pointless","case.d2c4.ask.ask.tech.tag":"tech","case.d2c4.ask.ask.git.q":"You have no GitHub and no talks. Why?","case.d2c4.ask.ask.git.a":"Fourteen years inside the closed network of an industrial company. There's nothing to take out, and I didn't want to write for the drawer","case.d2c4.ask.ask.git.tag":"awkward","case.d2c4.ask.ask.cut.q":"How did the redundancy happen?","case.d2c4.ask.ask.cut.a":"They closed the whole operations department, the order is attached. My manager called to apologise — he's the one who gave the reference","case.d2c4.ask.ask.cut.tag":"documents","case.d2c4.ask.ask2.index.q":"When does an index make things worse?","case.d2c4.ask.ask2.index.a":"When you write more often than you read: every insert updates the index. Once I dropped three indexes and inserts got twice as fast","case.d2c4.ask.ask2.index.tag":"tech","case.d2c4.ask.ask2.backup.q":"How did you check that a backup actually worked?","case.d2c4.ask.ask2.backup.a":"Once a month I restored a copy on a separate server and compared checksums. A backup you've never restored isn't a backup","case.d2c4.ask.ask2.backup.tag":"tech","case.d2c4.ask.ask2.learn.q":"How did you keep learning with the same stack all around you?","case.d2c4.ask.ask2.learn.a":"Documentation and mailing lists. I keep my own server at home and try there what work would never allow","case.d2c4.ask.ask2.learn.tag":"motivation","case.d2c4.ask.ask2.age.q":"You're 38 and applying for an ordinary DBA role. No ambition to grow?","case.d2c4.ask.ask2.age.a":"I want to do my job in peace. I tried managing people — not for me, I went back to databases","case.d2c4.ask.ask2.age.tag":"awkward","case.d2c4.cue.0":"not a single loud word","case.d2c4.cue.1":"answered the salary question straight","case.d2c4.herring.0":"Salary expectations noticeably below market — looks worrying, but the protocol calls it not grounds for rejection","case.d2c4.herring.1":"No GitHub and no public talks: 14 years inside the closed network of an industrial company","case.d2c4.herring.2":"Six months out of work — a staff reduction, with a copy of the order","case.d2c4.herring.3":"A single employment entry in 14 years is rare, but not a lie","case.d2c5.name":"Nika Lugovaya, 33","case.d2c5.channelTitle":"INTERVIEW · 13:15","case.d2c5.feedbackCorrect":"Five mismatches: the years of the stack, the number of DAGs, the team size, someone else's library and dates that don't line up. And the same Lanskoy in the references — the third time in two days","case.d2c5.feedbackWrong":"A data lead who never wrote a line of «her own» library. The very first migration sprint turns into somebody else's night shifts", ag":"tech","case.d2c5.ask.ask2.dq.q":"How did you catch bad data in the pipeline?","case.d2c5.ask.ask2.dq.a":"We had checks on row counts and nulls. If something looked off we wrote to the chat and fixed it by hand","case.d2c5.ask.ask2.dq.tag":"tech","case.d2c5.ask.ask2.money.q":"400 thousand — based on what?","case.d2c5.ask.ask2.money.a":"That's what a data platform lead costs. I have ten years and my own library","case.d2c5.ask.ask2.money.tag":"money","case.d2c5.ask.ask2.team.q":"How did you build a team of twelve?","case.d2c5.ask.ask2.team.a":"Some I moved over from neighbouring departments, some I hired. I ran the interviews myself","case.d2c5.ask.ask2.team.tag":"team","case.d2c5.ask.ask2.free.q":"A year of freelance — what were the projects?","case.d2c5.ask.ask2.free.a":"Various, mostly consulting. The names are under NDA, there's nothing to show","case.d2c5.ask.ask2.free.tag":"awkward","case.d2c5.cue.0":"answers the Airflow question before it's finished","case.d2c5.cue.1":"produces numbers without hesitation","case.d2c5.contra.cv.airflow|tk.hist.note":"Airflow was introduced at Svet-Media in 2019, while the résumé claims ten years of it since 2013. Before 2019 there was cron (protocols 2 and 3)","case.d2c5.contra.cv.airflow|tk.dags.note":"400 DAGs against 62 in the company's tech sheet at the time she left (protocol 4)","case.d2c5.contra.iv.team|tk.team.note":"In the interview it's a team of twelve she «assembled herself». The tech sheet says three people and a different head (protocol 4)","case.d2c5.contra.cv.repo|pf.author.note":"The etl-core library is claimed as hers, but the sources still carry another author's copyright and the whole thing was uploaded as one archive three weeks ago (protocol 6)","case.d2c5.contra.cv.dates|ref.dates.note":"The résumé says she left in 2023 and has freelanced since; the reference says she worked until August 2024 (protocol 1)","case.d2c5.contra.ask.dates|ref.dates.note":"In her answer she repeats it: left in the summer of nce","case.d3c3.doc.Рекомендации.f.ref.text.value":"«came back after burnout and the first thing he did was rewrite his own old pipeline, because he found a leak in it»","case.d3c3.doc.Рекомендации.f.ref.gap.label":"About the break","case.d3c3.doc.Рекомендации.f.ref.gap.value":"«six months out of work, it was visible and it was necessary»","case.d3c3.probe.pr.nb.label":"Check the notebook metadata","case.d3c3.probe.pr.nb.result":"Kernel logs and metadata match his account, the edits are spread across nine months rather than uploaded in a single day","case.d3c3.tr.0.text":"The candidate looks tired but focused","case.d3c3.tr.1.text":"There's a six-month hole in my résumé. That was burnout, I was treated for it. I can go into detail if you need","case.d3c3.tr.iv.leak.text":"It's when something only known after the fact gets into the features. The validation metric shoots up and production falls apart. I found exactly that leak in my own work — a year later","case.d3c3.ask.ask.burn.q":"Six months of burnout — what changed afterwards?","case.d3c3.ask.ask.burn.a":"I stopped taking three projects at once. And I started writing «I won't make it» in the chat instead of staying silent until the deadline","case.d3c3.ask.ask.burn.tag":"awkward","case.d3c3.ask.ask.leak.q":"What is target leakage?","case.d3c3.ask.ask.leak.a":"When something only known after the fact gets into the features. The metric shoots up, production falls apart. I found one of those in my own work a year later","case.d3c3.ask.ask.leak.tag":"tech","case.d3c3.ask.ask.nb.q":"Why is an invalid experiment flagged in your notebook?","case.d3c3.ask.ask.nb.a":"So nobody reuses it. I peeked into the future and wrote it down myself — embarrassing, but useful","case.d3c3.ask.ask.nb.tag":"authorship","case.d3c3.ask.ask.team.q":"Why did you stay on the same team?","case.d3c3.ask.ask.team.a":"Because there nobody pretended nothing had happened","case.d3c3.ask.ask.team.tag":"team","case.d3c3.ask.ask2.val.q":"How do you build validation over time?","case.d3c3.ask.ask2.val.a":"Forward only: train on the past, test on the future. A random split on time-series data lies","case.d3c3.ask.ask2.val.tag":"tech","case.d3c3.ask.ask2.doc.q":"Which part of the paper was yours?","case.d3c3.ask.ask2.doc.a":"The offline metrics and the dataset preparation. The section text is mine, so are the experiments","case.d3c3.ask.ask2.doc.tag":"authorship","case.d3c3.ask.ask2.limit.q":"How do you know now when it's time to stop?","case.d3c3.ask.ask2.limit.a":"If I stay late a third evening in a row, I write in the chat that I'm behind. I used to stay quiet until I broke","case.d3c3.ask.ask2.limit.tag":"motivation","case.d3c3.cue.0":"showed the invalid experiment himself","case.d3c3.cue.1":"talks about the break without excuses","case.d3c3.herring.0":"Six months of burnout in the résumé — by the protocol this is NOT grounds for rejection","case.d3c3.herring.1":"He is the second author of the same paper Lipatov claimed: matching names alone prove nothing","case.d3c3.herring.2":"He attached a notebook with a failed experiment himself — wolves don't do that","case.d3c4.name":"Ilya Sunkov, 27","case.d3c4.channelTitle":"INTERVIEW · 12:45","case.d3c4.feedbackCorrect":"He claimed the same paper Lipatov did, only from the other side — through an abbreviated surname. The HR letter finished it: an intern, eight months, someone else's project","case.d3c4.feedbackWrong":"The third wolf circling one paper. Inside, he'll be the «author» of your dashboards exactly the way he was the author of that publication","case.d3c4.metaKey.Позиция":"Position","case.d3c4.metaKey.Стаж заявлен":"Claimed experience","case.d3c4.metaVal.Стаж заявлен":"5 years","case.d3c4.metaKey.Ожидания":"Expectations","case.d3c4.metaKey.Источник":"Source","case.d3c4.metaVal.Источник":"applied directly","case.d3c4.doc.Резюме.tab":"Résumé","case.d3c4.doc.Резюме.f.cv.paper.label":"Publication","case.d3c4.doc.Резюме.f.cv.paper.value":"«third author of „Ranki t fails once in twenty runs. What do you do?","case.d4c2.ask.ask.flaky.a":"I don't disable it. Logs, video, a rerun with network delay. Usually it's a race or shared state. Disabling is the last step and only with a ticket","case.d4c2.ask.ask.flaky.tag":"tech","case.d4c2.ask.ask.ref.q":"Why no references at all?","case.d4c2.ask.ask.ref.a":"I'm leaving on bad terms: we disagreed about whether to write automated tests at all. My manager will honestly say I'm difficult","case.d4c2.ask.ask.ref.tag":"references","case.d4c2.ask.ask.dead.q":"What do you do with tests nobody maintains?","case.d4c2.ask.ask.dead.a":"Delete them. A test that's always green and nobody understands is worse than no test — it creates false calm","case.d4c2.ask.ask.dead.tag":"awkward","case.d4c2.ask.ask.task.q":"How will you prove your level without references?","case.d4c2.ask.ask.task.a":"Give me a live task. I'll take apart a flaky test from the log in front of you — that's more honest than any reference","case.d4c2.ask.ask.task.tag":"motivation","case.d4c2.ask.ask2.pyramid.q":"Which kind of tests should there be more of?","case.d4c2.ask.ask2.pyramid.a":"Unit tests — they're cheap to keep. E2E I save for critical paths, otherwise the run grows and everyone starts ignoring it","case.d4c2.ask.ask2.pyramid.tag":"tech","case.d4c2.ask.ask2.ci.q":"What if the CI run takes an hour?","case.d4c2.ask.ask2.ci.a":"Split it into fast and slow, run the fast ones on every push. And remove duplicate tests, there are always plenty","case.d4c2.ask.ask2.ci.tag":"tech","case.d4c2.ask.ask2.money.q":"280 thousand — why that much?","case.d4c2.ask.ask2.money.a":"Five years of test automation in a bank. I know what a missed bug in payments costs","case.d4c2.ask.ask2.money.tag":"money","case.d4c2.ask.ask2.conflict.q":"What exactly was the conflict about?","case.d4c2.ask.ask2.conflict.a":"My manager considered automated tests a waste. I showed him the regression numbers — it didn't convince him","case.d4c2.ask.ask2.conflic .f.cv2.date.label":"Publication date","case.d4c3.doc.Проверка CVE.f.cv2.date.value":"March 2024","case.d4c3.doc.Проверка CVE.f.cv2.check.label":"Acknowledgements list","case.d4c3.doc.Проверка CVE.f.cv2.check.value":"two researchers, Zarov doesn't appear in a single line of the record","case.d4c3.doc.Профиль bug bounty.tab":"Bug bounty profile","case.d4c3.doc.Профиль bug bounty.f.bb.stats.label":"Profile at the link","case.d4c3.doc.Профиль bug bounty.f.bb.stats.value":"3 accepted reports, all low severity","case.d4c3.doc.Профиль bug bounty.f.bb.rank.label":"Rating","case.d4c3.doc.Профиль bug bounty.f.bb.rank.value":"not in the top 1000","case.d4c3.doc.Профиль bug bounty.f.bb.join.label":"Account created","case.d4c3.doc.Профиль bug bounty.f.bb.join.value":"8 months ago","case.d4c3.doc.Интервью-тест.tab":"Interview test","case.d4c3.doc.Интервью-тест.f.tz.sqli.label":"On SQL injection","case.d4c3.doc.Интервью-тест.f.tz.sqli.value":"«cured by escaping quotes on the frontend»","case.d4c3.doc.Интервью-тест.f.tz.jwt.label":"On JWT","case.d4c3.doc.Интервью-тест.f.tz.jwt.value":"«the main thing is not to keep it in localStorage, then the signature can't be forged»","case.d4c3.probe.pr.cve.label":"Open the CVE record and the acknowledgements","case.d4c3.probe.pr.cve.result":"Discovered by L. Marchetti, with two researchers credited. Zarov appears nowhere in the record","case.d4c3.tr.0.text":"The candidate talks in jargon, leaving sentences unfinished","case.d4c3.tr.1.text":"I have my own CVE and sixty reports on the platform. I've been probing perimeters for four years","case.d4c3.tr.2.text":"How do you defend against SQL injection?","case.d4c3.tr.iv.sqli.text":"Escape the quotes on the frontend and filter the input. If the frontend is clean, nothing reaches the database","case.d4c3.tr.iv.link.text":"Here, only the rating didn't load, the platform is buggy","case.d4c3.ask.ask.cve.q":"How did you find your CVE?","case.d4c3.ask.ask.cve.a":"I fuzzed the library for a week. I published through an intermediary, so the record may carry a different name","case.d4c3.ask.ask.cve.tag":"authorship","case.d4c3.ask.ask.bb.q":"Give me the link to your bug bounty profile","case.d4c3.ask.ask.bb.a":"Here, only the rating didn't load — the platform is buggy. There are sixty-odd reports in there","case.d4c3.ask.ask.bb.tag":"numbers","case.d4c3.ask.ask.jwt.q":"Can a JWT signature be forged?","case.d4c3.ask.ask.jwt.a":"No, as long as you don't keep the token in localStorage. Then the signature can't be forged","case.d4c3.ask.ask.jwt.tag":"tech","case.d4c3.ask.ask2.xss.q":"How does XSS differ from CSRF?","case.d4c3.ask.ask2.xss.a":"XSS is when they inject a script, CSRF is almost the same, only through a link","case.d4c3.ask.ask2.xss.tag":"tech","case.d4c3.ask.ask2.report.q":"Show me an example of your pentest report","case.d4c3.ask.ask2.report.a":"The reports are under NDA, I can't take them out. I can describe them in words","case.d4c3.ask.ask2.report.tag":"documents","case.d4c3.ask.ask2.money.q":"360k — based on what?","case.d4c3.ask.ask2.money.a":"I have my own CVE and a top ranking on the platform. That's below market for people like me","case.d4c3.ask.ask2.money.tag":"money","case.d4c3.ask.ask2.tool.q":"What do you scan the perimeter with?","case.d4c3.ask.ask2.tool.a":"Standard scanners. I won't name them, that's my methodology","case.d4c3.ask.ask2.tool.tag":"tech","case.d4c3.cue.0":"gives the link with a caveat about the platform","case.d4c3.cue.1":"talks in jargon, at a fast pace","case.d4c3.contra.cv.cve|cv2.rec.note":"The CVE exists, but it was found by a different researcher; Zarov isn't even in the acknowledgements (protocol 6)","case.d4c3.contra.cv.bb|bb.stats.note":"«Top 50, 60+ reports» against his own profile: 3 low-severity reports and an account eight months old (protocols 4 and 6)","case.d4c3.contra.cv.pentest|iv.sqli.note":"Four years of pentesting and «injections are cured by escaping quotes on the frontend» — seniority doesn't match the answers (protocol 5)","case.d4c3.contra.cv.pentest|tz.jwt.note":"He believes a JWT signature can't be forged as long as the token isn't in localStorage. That has nothing to do with signatures (protocol 5)","case.d4c3.contra.ask.cve|cv2.rec.note":"«I published through an intermediary» doesn't explain why a different researcher is listed as the discoverer (protocol 6)","case.d4c3.contra.ask.bb|bb.stats.note":"«Sixty reports, the rating didn't load» against his own profile: three low-severity reports (protocol 4)","case.d4c4.name":"Yulia Beketova, 31","case.d4c4.channelTitle":"INTERVIEW · 12:10","case.d4c4.feedbackCorrect":"A loud number that survived checking. What separates her from a wolf is that she specified herself which time she meant","case.d4c4.feedbackWrong":"You rejected a lead over a figure that sat confirmed in the next tab. She qualified it herself, before you even asked","case.d4c4.metaKey.Позиция":"Position","case.d4c4.metaKey.Стаж заявлен":"Claimed experience","case.d4c4.metaVal.Стаж заявлен":"8 years","case.d4c4.metaKey.Ожидания":"Expectations","case.d4c4.metaKey.Источник":"Source","case.d4c4.metaVal.Источник":"referral","case.d4c4.doc.Резюме.tab":"Résumé","case.d4c4.doc.Резюме.f.cv.lead.label":"Role","case.d4c4.doc.Резюме.f.cv.lead.value":"QA Lead, team of 7, Klyon retail platform, 2021 — now","case.d4c4.doc.Резюме.f.cv.result.label":"Result","case.d4c4.doc.Резюме.f.cv.result.value":"«regression from 5 days to 6 hours»","case.d4c4.doc.Резюме.f.cv.before.label":"Before that","case.d4c4.doc.Резюме.f.cv.before.value":"manual tester, 2017 — 2021","case.d4c4.doc.Отчёт по релизам.tab":"Release report","case.d4c4.doc.Отчёт по релизам.note":"an export from the internal dashboard, attached with permission","case.d4c4.doc.Отчёт по релизам.f.rp.before.label":"Regression before automation","case.d4c4.doc.Отчёт по релизам.f.rp.before.value":"38 person-hours (5 working days for the team)","case.d4c4.doc.Отчёт по релизам.f.rp.after.label":"Regression after","case.d 4c4.ask.ask.num.q":"«From five days to six hours» — what exactly does that measure?","case.d4c4.ask.ask.num.a":"Machine run time. The full cycle with manual checking is eight hours; in the résumé I quote machine time","case.d4c4.ask.ask.num.tag":"numbers","case.d4c4.ask.ask.dead.q":"What do you do with dead tests?","case.d4c4.ask.ask.dead.a":"We delete them and record in the test plan what we chose not to cover. I have a «what we don't cover» section","case.d4c4.ask.ask.dead.tag":"tech","case.d4c4.ask.ask.leave.q":"Why are you leaving?","case.d4c4.ask.ask.leave.a":"They cancelled remote work and I'm in another city. I'm sorry about the team, but commuting every day isn't possible","case.d4c4.ask.ask.leave.tag":"motivation","case.d4c4.ask.ask.flaky.q":"What share of your tests is unstable?","case.d4c4.ask.ask.flaky.a":"2.1%, the monthly trend is attached. Zero doesn't happen; anyone who says «zero» simply isn't counting","case.d4c4.ask.ask.flaky.tag":"awkward","case.d4c4.ask.ask2.metric.q":"How do you know the tests are worth anything?","case.d4c4.ask.ask2.metric.a":"I watch how many bugs are caught before release and how many arrive from users. The second number has to fall, otherwise the tests are decoration","case.d4c4.ask.ask2.metric.tag":"tech","case.d4c4.ask.ask2.people.q":"How did you grow two team leads inside the team?","case.d4c4.ask.ask2.people.a":"I handed them my own tasks along with the right to get them wrong. I stayed close for the first releases, then let go","case.d4c4.ask.ask2.people.tag":"team","case.d4c4.ask.ask2.money.q":"340k — justify it","case.d4c4.ask.ask2.money.a":"QA Lead with a team of seven. I know I can fix the regression, but I won't promise zero bugs","case.d4c4.ask.ask2.money.tag":"money","case.d4c4.ask.ask2.no.q":"When did you say no to management?","case.d4c4.ask.ask2.no.a":"When they asked to release on a Friday without a regression run. We agreed on Monday, and that was right","case.d4c4.ask.ask2.no.tag":"awkward","case.d4c4.cue.0":"clarified herself that the figure is machine time","case.d4c4.cue.1":"brought the «what we don't cover» section","case.d4c4.herring.0":"«From 5 days to 6 hours» sounds like classic padding — but the dashboard export confirms it","case.d4c4.herring.1":"Rising from manual tester to lead in four years is not grounds for rejection, it's an ordinary path in a growing team","case.d4c4.herring.2":"Leaving a good company is explained by the cancellation of remote work and confirmed by the reference","case.d4c5.name":"Artur Mezentsev, 35","case.d4c5.channelTitle":"INTERVIEW · 13:05","case.d4c5.feedbackCorrect":"The most common padding at lead level is a saving computed from imaginary growth. The register record and the budget close the question in a minute","case.d4c5.feedbackWrong":"He'll arrive with a deck and promise the board a saving that cannot exist. You'll be the one doing the arithmetic afterwards","case.d4c5.metaKey.Позиция":"Position","case.d4c5.metaKey.Стаж заявлен":"Claimed experience","case.d4c5.metaVal.Стаж заявлен":"14 years","case.d4c5.metaKey.Ожидания":"Expectations","case.d4c5.metaKey.Источник":"Source","case.d4c5.metaVal.Источник":"applied directly","case.d4c5.doc.Резюме.tab":"Résumé","case.d4c5.doc.Резюме.f.cv.docker.label":"Experience","case.d4c5.doc.Резюме.f.cv.docker.value":"«Docker in production since 2010, our own orchestrator before Kubernetes»","case.d4c5.doc.Резюме.f.cv.company.label":"Job","case.d4c5.doc.Резюме.f.cv.company.value":"Stack-Garant LLC, platform lead, 2010 — 2024","case.d4c5.doc.Резюме.f.cv.savings.label":"Result","case.d4c5.doc.Резюме.f.cv.savings.value":"«saved 180 million ₽ a year on infrastructure»","case.d4c5.doc.Выписка ЕГРЮЛ.tab":"Company register record","case.d4c5.doc.Выписка ЕГРЮЛ.f.eg.reg.label":"Stack-Garant LLC","case.d4c5.doc.Выписка ЕГРЮЛ.f.eg.reg.value":"registered 22.08.2014","case.d4c5.doc.Выписка ЕГРЮЛ.f.eg.rev.label":"Annual revenue (latest filing)","case.d4c5.doc.Выписка ЕГРЮЛ.f.eg.rev.value":"94 million ₽", s and grown tenfold, we'd have spent 180 million more","case.d4c5.ask.ask.money.tag":"numbers","case.d4c5.ask.ask.docker.q":"Docker in production since 2010 — how?","case.d4c5.ask.ask.docker.a":"Well, containers in the broad sense. We used similar technology, later it became Docker","case.d4c5.ask.ask.docker.tag":"dates","case.d4c5.ask.ask.team.q":"Who else worked on the platform?","case.d4c5.ask.ask.team.a":"Formally a team, but I set the architecture alone. The rest carried it out","case.d4c5.ask.ask.team.tag":"team","case.d4c5.ask.ask2.k8s.q":"What is a namespace in Kubernetes?","case.d4c5.ask.ask2.k8s.a":"It's like a folder for applications. We split them by department so as not to get confused","case.d4c5.ask.ask2.k8s.tag":"tech","case.d4c5.ask.ask2.cost.q":"What made up the infrastructure budget?","case.d4c5.ask.ask2.cost.a":"Servers, licences, cloud. I don't remember the exact figures, finance kept those separately","case.d4c5.ask.ask2.cost.tag":"numbers","case.d4c5.ask.ask2.money.q":"480 thousand — why?","case.d4c5.ask.ask2.money.a":"A platform lead with savings in the hundreds of millions. I'm valuing myself modestly","case.d4c5.ask.ask2.money.tag":"money","case.d4c5.ask.ask2.team.q":"Who argued with your decisions?","case.d4c5.ask.ask2.team.a":"Rarely anyone. I usually explained things so well that no questions were left","case.d4c5.ask.ask2.team.tag":"team","case.d4c5.cue.0":"happily counts money out loud","case.d4c5.cue.1":"arrived with a slide deck","case.d4c5.contra.cv.company|eg.reg.note":"Work at Stack-Garant since 2010, while the company was registered in August 2014 (protocol 3)","case.d4c5.contra.cv.docker|tk.docker.note":"«Docker in production since 2010» — Docker itself shipped in 2013, and the company only containerised in 2016 (protocols 2 and 3)","case.d4c5.contra.cv.savings|tk.budget.note":"A saving of 180 million a year when the whole infrastructure budget is 21 million — arithmetically impossible (protocol 4)","case.d4c5.contra.cv.savings| iews?","case.d5c4.ask.ask.reviews.a":"I can't delete them, and I wouldn't want to. The design there really is weak, I'm not a designer","case.d5c4.ask.ask.reviews.tag":"motivation","case.d5c4.ask.ask2.state.q":"How do you survive a configuration change in Android?","case.d5c4.ask.ask2.state.a":"State in the ViewModel, the heavy parts in SavedStateHandle. Otherwise rotating the screen wipes the form","case.d5c4.ask.ask2.state.tag":"tech","case.d5c4.ask.ask2.crash.q":"How do you catch crashes on users' devices?","case.d5c4.ask.ask2.crash.a":"Crash reports in the store and logs. In my own app I look myself, there are only 900 installs","case.d5c4.ask.ask2.crash.tag":"tech","case.d5c4.ask.ask2.money.q":"270 thousand with three years — why?","case.d5c4.ask.ask2.money.a":"In the studio I covered the work of two seniors who left. If I don't prove it during probation — lower it","case.d5c4.ask.ask2.money.tag":"money","case.d5c4.ask.ask2.nda.q":"What if we don't believe in the NDA projects?","case.d5c4.ask.ask2.nda.a":"Give me a harder take-home task. That's more honest than my word about closed projects","case.d5c4.ask.ask2.nda.tag":"awkward","case.d5c4.cue.0":"said himself that part of the take-home was new to him","case.d5c4.cue.1":"doesn't dress up his 900 downloads","case.d5c4.herring.0":"«NDA projects with no links» — typical outsourcing, the protocol calls it not grounds for rejection","case.d5c4.herring.1":"His own app with 900 downloads and a 3.9 rating looks pale, but it is real and open","case.d5c4.herring.2":"Admitting «I hadn't done this before» sounds like weakness — in fact it's what separates him from the wolves","case.d5c5.name":"Margo Sineva, 29","case.d5c5.channelTitle":"INTERVIEW · 13:40","case.d5c5.feedbackCorrect":"A typo in a chart caption travelled along with the slides — that's how borrowed decks are identified. Two hundred and forty interviews turned out to be thirty-one","case.d5c5.feedbackWrong":"She will «run research» by bringing slides from oth e growth came from one large contract","case.d5c6.ask.ask.calc.tag":"numbers","case.d5c6.ask.ask.brigade.q":"How does the foreman background help?","case.d5c6.ask.ask.brigade.a":"I know what a person looks like when our product gets in the way of their work. And I'm not afraid to tell a customer we're lying about deadlines","case.d5c6.ask.ask.brigade.tag":"motivation","case.d5c6.ask.ask.weak.q":"What are you weak at?","case.d5c6.ask.ask.weak.a":"Presentations. You won't get pretty slides from me, I draw by hand","case.d5c6.ask.ask.weak.tag":"awkward","case.d5c6.ask.ask.churn.q":"Who churns most often?","case.d5c6.ask.ask.churn.a":"Small customers, 21% against 4% for large ones. It's a separate line in the report, I don't hide it","case.d5c6.ask.ask.churn.tag":"tech","case.d5c6.ask.ask2.sales.q":"How do you work with sales?","case.d5c6.ask.ask2.sales.a":"I ask them not to promise deadlines without me. Once they did and we spent six months cleaning up","case.d5c6.ask.ask2.sales.tag":"team","case.d5c6.ask.ask2.money.q":"350 thousand — why?","case.d5c6.ask.ask2.money.a":"A B2B product manager with retention and integrations behind him. No pretty slides, but the numbers are mine","case.d5c6.ask.ask2.money.tag":"money","case.d5c6.ask.ask2.brig.q":"A foreman in product — doesn't the building-site language get in the way?","case.d5c6.ask.ask2.brig.a":"Sometimes it does. On the other hand I'm not afraid to tell a customer to their face that we won't make it","case.d5c6.ask.ask2.brig.tag":"awkward","case.d5c6.cue.0":"said himself which calculation would look prettier","case.d5c6.cue.1":"admitted his weakness before being asked","case.d5c6.herring.0":"Two industry changes and a «non-technical» background — not grounds for rejection (protocol 8)","case.d5c6.herring.1":"The 78% → 89% figure is loud, but he explained the method himself and named the weak spot in it","case.d5c6.herring.2":"Homemade hand-drawn artifacts look unpolished — and they are genuine customer work","case.d6 text":"What is the service pastuh.pro?","case.d6c1.tr.iv.pastuh.text":"Career consulting. We help people tell their story properly. Nothing illegal, if that's what you're asking","case.d6c1.ask.ask3.people.q":"Name an engineer you grew and what they can do now","case.d6c1.ask.ask3.people.a":"There are many, you can't remember them all. People come and go, I keep relationships, not lists","case.d6c1.ask.ask3.people.tag":"team","case.d6c1.ask.ask3.tech.q":"Which technical decision did you overturn, and why?","case.d6c1.ask.ask3.tech.a":"I don't overturn technical things, that's what engineers are for. My job is to reach agreement and sell the result","case.d6c1.ask.ask3.tech.tag":"tech","case.d6c1.ask.ask3.fail.q":"Which of your hires turned out to be a mistake?","case.d6c1.ask.ask3.fail.a":"There were no mistakes. The people I brought in always delivered","case.d6c1.ask.ask3.fail.tag":"awkward","case.d6c1.ask.ask.phone.q":"I've seen your number four times this week. Explain","case.d6c1.ask.ask.phone.a":"I'm a known name in the industry. Plenty of people list me as a reference, that's normal practice","case.d6c1.ask.ask.phone.tag":"documents","case.d6c1.ask.ask.tech.q":"Describe the architecture you were responsible for","case.d6c1.ask.ask.tech.a":"I was responsible for people, not diagrams. Engineers drew the architecture, I delivered the result","case.d6c1.ask.ask.tech.tag":"tech","case.d6c1.ask.ask.teams.q":"120 engineers — at which companies?","case.d6c1.ask.ask.teams.a":"At my two: Greenline-Data and Otara-Tech. Some are contractors, so you won't see them on the payroll","case.d6c1.ask.ask.teams.tag":"numbers","case.d6c1.ask.ask2.hire.q":"How do you assess an engineer in an interview?","case.d6c1.ask.ask2.hire.a":"By their confidence and their résumé. Others check the technical side, I look at the person","case.d6c1.ask.ask2.hire.tag":"tech","case.d6c1.ask.ask2.money.q":"600 thousand — justify it","case.d6c1.ask.ask2.money.a":"Nineteen years and a hundred and twenty people under management","case.d6c1.ask.ask2.money.tag":"money","case.d6c1.cue.0":"talks about people and process, never about technology","case.d6c1.cue.1":"answers follow-ups with ready-made phrases","case.d6c1.contra.cv.job|pk.grin.note":"«CTO of Greenline-Data LLC» — no such company exists in the register (protocol 3)","case.d6c1.contra.cv.teams|pk.otara.note":"120 engineers under management against Otara-Tech with a headcount of one — himself as the founder (protocol 4)","case.d6c1.contra.cv.phone|ps.phone.note":"The candidate's phone is the contact number of a service selling résumés and references for 45,000 ₽ (protocol 7)","case.d6c1.contra.cv.phone|ar.d1.note":"The same number was the reference for Kuliev on Tuesday — and matched the candidate's own phone (protocol 7)","case.d6c1.contra.cv.name|ar.d4.note":"He is also the «CTO» in Oshev's reference, issued from a domain created six weeks before that application (protocol 7)","case.d6c1.contra.iv.pastuh|ps.price.note":"«Career consulting» is a price list reading «turnkey résumé + a reference on call» for 45,000 ₽ (protocol 7)","case.d6c1.contra.ask.teams|pk.otara.note":"«120 engineers across my two companies» against Otara-Tech with a headcount of one (protocol 4)","case.d6c1.contra.ask.phone|ps.phone.note":"«Plenty of people list me as a reference» doesn't explain why that number sits in the footer of a site selling references (protocol 7)","case.d6c2.name":"Irina Bogush, 39","case.d6c2.channelTitle":"INTERVIEW · 10:15","case.d6c2.feedbackCorrect":"The only person all week who brought her own outage with 26 minutes of downtime. Résumés like that aren't bought — they're written","case.d6c2.feedbackWrong":"You rejected a staff engineer for describing an outage honestly. This is exactly why people put nothing but wins in a résumé","case.d6c2.metaKey.Позиция":"Position","case.d6c2.metaKey.Стаж заявлен":"Claimed experience","case.d6c2.metaVal.Стаж заявлен":"10 years","case.d6c2.metaKey.Ожидания":"Expectations","case.d6c2.metaKey.Источник":"Source","case.d6c2.metaVal.Источник":"referred by Akhmedova","case.d6c2.doc.Резюме.tab":"Résumé","case.d6c2.doc.Резюме.note":"polished, yet without a single round number","case.d6c2.doc.Резюме.f.cv.work.label":"Job","case.d6c2.doc.Резюме.f.cv.work.value":"Mera payment processing, staff engineer, 2016 — now","case.d6c2.doc.Резюме.f.cv.claim.label":"Result","case.d6c2.doc.Резюме.f.cv.claim.value":"«cut deploy time from 40 to 12 minutes; the 2022 outage was mine»","case.d6c2.doc.Резюме.f.cv.rfc.label":"Artifacts","case.d6c2.doc.Резюме.f.cv.rfc.value":"eight internal RFCs, two rejected by colleagues","case.d6c2.doc.Разбор аварии.tab":"Outage post-mortem","case.d6c2.doc.Разбор аварии.note":"attached by her","case.d6c2.doc.Разбор аварии.f.pm.what.label":"What happened","case.d6c2.doc.Разбор аварии.f.pm.what.value":"her change to the balancer config took payments down for 26 minutes","case.d6c2.doc.Разбор аварии.f.pm.why.label":"Cause","case.d6c2.doc.Разбор аварии.f.pm.why.value":"she tested on a staging rig with no real traffic","case.d6c2.doc.Разбор аварии.f.pm.after.label":"What she changed","case.d6c2.doc.Разбор аварии.f.pm.after.value":"introduced mandatory canary deploys and automatic rollback","case.d6c2.doc.Рекомендации.tab":"References","case.d6c2.doc.Рекомендации.f.ref.who.label":"Who","case.d6c2.doc.Рекомендации.f.ref.who.value":"Mera's CTO, L. Romanets; and T. Akhmedova (former colleague)","case.d6c2.doc.Рекомендации.f.ref.text.label":"Reference","case.d6c2.doc.Рекомендации.f.ref.text.value":"«after her outage we finally got a proper deploy process; she brought the post-mortem to the all-hands review herself»","case.d6c2.doc.Рекомендации.f.ref.leave.label":"Why leaving","case.d6c2.doc.Рекомендации.f.ref.leave.value":"«the company is being acquired, the technical side is moving to a different stack»","case.d6c2.doc.Проверка.tab":"Verification","case.d6c2.doc.Проверка.f.ch.egrul.label":"Mera's register record","case.d6c2.doc.Проверка.f.ch.egrul.value":"registered 2011, active, headcount 240","case.d6c2.doc.Проверка.f.ch.rfc.value":"internal documents, some sent directly by the CTO","case.d6c2.doc.Проверка.f.ch.check.label":"CTO's reply","case.d6c2.doc.Проверка.f.ch.check.value":"staff engineer since 2019, senior from 2016 before that; eight RFCs under her name; outage on 14.06.2022, post-mortem in the internal wiki","case.d6c2.probe.pr.cto.label":"Call Mera's CTO","case.d6c2.probe.pr.cto.result":"Romanets: «Staff since 2019, senior before that. The RFCs are hers. The 2022 outage — yes, and it's the best thing that happened to us: canary deploys came out of it»","case.d6c2.tr.0.text":"The candidate answers slowly and precisely","case.d6c2.tr.1.text":"My résumé includes my own outage: 26 minutes of payments down. I put it there on purpose — it says more about me than my wins do","case.d6c2.tr.iv.rfc.text":"Because colleagues found holes in them. One I later rewrote, the other stayed a bad idea","case.d6c2.ask.ask3.debt.q":"How do you decide when to pay down tech debt and when to live with it?","case.d6c2.ask.ask3.debt.a":"I count what it costs per week: on-call, rollbacks, manual checks. If that's more than a week of work — we fix it","case.d6c2.ask.ask3.debt.tag":"tech","case.d6c2.ask.ask3.push.q":"What do you do when the business demands a release today?","case.d6c2.ask.ask3.push.a":"I ask what we can leave out. Usually it turns out they need one button, not the whole release","case.d6c2.ask.ask3.push.tag":"team","case.d6c2.ask.ask3.grow.q":"What did you learn in the past year?","case.d6c2.ask.ask3.grow.a":"That my outage wasn't about a config, it was about a process. It took a year to say that out loud","case.d6c2.ask.ask3.grow.tag":"motivation","case.d6c2.ask.ask.crash.q":"Tell me about your 26-minute outage","case.d6c2.ask.ask.crash.a":"I changed the balancer config and tested it on a rig with no real traffic. Payments stopped. That's where our canary deploys came from","case.d6c2.ask.ask.crash.tag":"awkward","case.d6c2.ask.ask.rfc.q":"Why were two of your RFCs rejected?","case.d6c2.ask.ask.rfc.a":"Colleagues found holes. One I later rewrote, the other stayed a bad idea","case.d6c2.ask.ask.rfc.tag":"team","case.d6c2.ask.ask.slo.q":"How do you ship a risky change now?","case.d6c2.ask.ask.slo.a":"A canary on 1% of traffic, automatic rollback on the error metric, and a human watching the graph","case.d6c2.ask.ask.slo.tag":"tech","case.d6c2.ask.ask2.rfc2.q":"What belongs in a good RFC?","case.d6c2.ask.ask2.rfc2.a":"Alternatives and the cost of saying no. Without a «why not this way» section it isn't an RFC, it's a pitch deck","case.d6c2.ask.ask2.rfc2.tag":"tech","case.d6c2.ask.ask2.oncall.q":"How is on-call organised in payments?","case.d6c2.ask.ask2.oncall.a":"Two lines, escalation after seven minutes. It appeared after my outage; before that we relied on someone calling","case.d6c2.ask.ask2.oncall.tag":"team","case.d6c2.cue.0":"put the outage in her own résumé","case.d6c2.cue.1":"not a single rounded number","case.d6c2.herring.0":"An outage she owns, right there in the résumé — looks like a red flag, and is in fact the strongest argument for her","case.d6c2.herring.1":"Very high salary expectations — they match the level and are confirmed by the CTO","case.d6c2.herring.2":"A smooth biography with no gaps raises suspicion out of habit: check the documents, not the feeling","case.d6c3.name":"Pavel Vetoshkin, 36","case.d6c3.channelTitle":"INTERVIEW · 11:10","case.d6c3.feedbackCorrect":"He claimed the architecture group's work and another team lead's role. Two services out of eleven turned into forty in seven months","case.d6c3.feedbackWrong":"A team lead who has never run an interview and confuses a saga with two-phase commit. He'll «build» a team all right — out of whoever Lanskoy sends","case.d6c3.metaKey.Позиция":"Position","case.d6c3.metaKey.Стаж заявлен":"Claimed experience","case.d6c3.metaVal.Стаж заявлен":"13 years","case.d6c3.metaKey.Ожидания":"Expectations","case.d6c3.metaKey.Источник":"Source","case.d6c3.metaVal.Источник":"applied directly","case.d6c3.doc.Резюме.tab":"Résumé","case.d6c3.doc.Резюме.f.cv.lead.label":"Role","case.d6c3.doc.Резюме.f.cv.lead.value":"team lead of 14, Stavka fintech, 2018 — 2025","case.d6c3.doc.Резюме.f.cv.result.label":"Result","case.d6c3.doc.Резюме.f.cv.result.value":"«broke the monolith into 40 microservices in 7 months»","case.d6c3.doc.Резюме.f.cv.hire.label":"Hiring","case.d6c3.doc.Резюме.f.cv.hire.value":"«built the team from scratch, 14 people in a quarter»","case.d6c3.doc.Справка «Ставки».tab":"Letter from Stavka","case.d6c3.doc.Справка «Ставки».f.sp.role.label":"Title","case.d6c3.doc.Справка «Ставки».f.sp.role.value":"lead developer, no direct reports","case.d6c3.doc.Справка «Ставки».f.sp.term.label":"Period","case.d6c3.doc.Справка «Ставки».f.sp.term.value":"March 2021 — January 2025","case.d6c3.doc.Справка «Ставки».f.sp.team.label":"Product team","case.d6c3.doc.Справка «Ставки».f.sp.team.value":"6 people, team lead — E. Dyachenko","case.d6c3.doc.Техкарта «Ставки».tab":"Stavka tech sheet","case.d6c3.doc.Техкарта «Ставки».f.tk.ms.label":"Microservices","case.d6c3.doc.Техкарта «Ставки».f.tk.ms.value":"11 services, breaking up the monolith took 2.5 years","case.d6c3.doc.Техкарта «Ставки».f.tk.who.label":"Who led the split","case.d6c3.doc.Техкарта «Ставки».f.tk.who.value":"the architecture group, 4 people, headed by E. Dyachenko","case.d6c3.doc.Техкарта «Ставки».f.tk.veto.label":"Note","case.d6c3.doc.Техкарта «Ставки».f.tk.veto.value":"P. Vetoshkin — author of two of the eleven services","case.d6c3.doc.Интервью-тест.tab":"Interview test","case.d6c3.doc.Интервью-тест.f.tz.saga.label":"On distributed transactions","case.d6c3.doc.Интервью-тест.f.tz.saga.value":"«a saga is when microservices all use one shared transaction manager»","case.d6c3.doc.Интервью-тест.f.tz.hire.label":"On hiring","case.d6c3.doc.Интервью-тест.f.tz.hire.value":"couldn't describe a single technical interview he had run","case.d6c3.probe.pr.lead.label":"Ask Stavka who led the split","case.d6c3.probe.pr.lead.result":"Reply: the architecture group was led by E. Dyachenko. P. Vetoshkin was a lead developer, author of two services, with no direct reports","case.d6c3.probe.pr.lead.evidence":"Stavka: the split was led by Dyachenko, Vetoshkin had no direct reports","case.d6c3.tr.0.text":"The candidate says «my team» in every answer","case.d6c3.tr.1.text":"I've been a team lead since eighteen. Forty microservices in seven months — that's my team and my plan","case.d6c3.tr.2.text":"How did you solve distributed transactions?","case.d6c3.tr.iv.saga.text":"With a saga. That's when all the microservices connect to a shared transaction manager and it keeps consistency","case.d6c3.tr.4.text":"Tell me about the last technical interview you ran","case.d6c3.tr.iv.hire.text":"HR ran the sections, I was more about architecture. But I built the team","case.d6c3.ask.ask.saga.q":"How did you solve distributed transactions?","case.d6c3.ask.ask.saga.a":"With a saga. That's when all the microservices connect to a shared transaction manager and it keeps consistency","case.d6c3.ask.ask.saga.tag":"tech","case.d6c3.ask.ask.hire.q":"Tell me about the last technical interview you ran","case.d6c3.ask.ask.hire.a":"HR ran the sections, I was more about architecture. But I built the team","case.d6c3.ask.ask.hire.tag":"team","case.d6c3.ask.ask.ms.q":"40 microservices in 7 months — how did you count them?","case.d6c3.ask.ask.ms.a":"I counted the supporting ones too. If you take only the product services it's fewer, but the plan was mine","case.d6c3.ask.ask.ms.tag":"numbers","case.d6c3.ask.ask.lead.q":"How many people reported to you?","case.d6c3.ask.ask.lead.a":"Fourteen. It isn't in the letter, formally — our leadership was informal","case.d6c3.ask.ask.lead.tag":"documents","case.d6c3.ask.ask2.2pc.q":"How does a saga differ from two-phase commit?","case.d6c3.ask.ask2.2pc.a":"Hardly at all. Both keep consistency through a coordinator","case.d6c3.ask.ask2.2pc.tag":"tech","case.d6c3.ask.ask2.split.q":"Where did you start breaking up the monolith?","case.d6c3.ask.ask2.split.a":"With whatever came away easiest. The plan was mine, I defended it","case.d6c3.ask.ask2.split.tag":"tech","case.d6c3.ask.ask2.money.q":"550 thousand — justify it","case.d6c3.ask.ask2.money.a":"A team lead with forty microservices. That's the market","case.d6c3.ask.ask2.money.tag":"money","case.d6c3.ask.ask2.one.q":"What did you discuss in one-to-ones?","case.d6c3.ask.ask2.one.a":"Tasks and deadlines. There was no time for career conversations","case.d6c3.ask.ask2.one.tag":"team","case.d6c3.cue.0":"answers every question with «my team»","case.d6c3.cue.1":"replaces specifics about hiring with generalities","case.d6c3.contra.cv.lead|sp.role.note":"Team lead of 14 in the résumé against the letter: lead developer with no direct reports (protocol 4)","case.d6c3.contra.cv.lead|sp.term.note":"The résumé says since 2018, the letter says from March 2021 (protocol 1)","case.d6c3.contra.cv.result|tk.ms.note":"«40 microservices in 7 months» against the tech sheet: 11 services and 2.5 years of work (protocol 4)","case.d6c3.contra.cv.hire|iv.hire.note":"«Built a team of 14 in a quarter» and «HR ran the sections, I was more about architecture» — one rules out the other (protocols 4 and 5)","case.d6c3.contra.cv.lead|tz.saga.note":"A team lead of a microservice architecture describes a saga as a shared transaction manager — the exact opposite of what it means (protocol 5)","case.d6c3.contra.ask.lead|sp.role.note":"«Fourteen reports, leadership was informal» against the letter: lead developer with no direct reports (protocol 4)","case.d6c3.contra.ask.ms|tk.ms.note":"«I counted the supporting ones too» doesn't save it: there are eleven services and the split took 2.5 years (protocol 4)","case.d6c4.name":"Arkady Neyman, 47","case.d6c4.channelTitle":"INTERVIEW · 12:10","case.d6c4.feedbackCorrect":"He handed over the
