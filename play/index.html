  /* Правила показываем по одному шагу: списком из восьми пунктов они не
     влезали ни в один экран, и кнопка «Назад» уезжала за край. */
  function renderHowTo() {
    const steps = (G.howto || []).slice();
    let i = 0;
    function draw() {
      root.innerHTML = ""; ensureFX();
      const sc = el("div", "screen doc-screen");
      const box = el("div", "reader steps");
      box.append(el("div", "step-count", `${esc(L("stepWord", "ШАГ"))} ${i + 1} ${esc(L("ofWord", "из"))} ${steps.length}`));
      box.append(el("h2", "reader-h", "КАК ИГРАТЬ"));
      box.append(el("p", "step-text", esc(steps[i] || "")));
      const dots = el("div", "step-dots");
      steps.forEach((_, n) => {
        const d = el("button", "dot" + (n === i ? " on" : ""));
        d.title = String(n + 1);
        d.onclick = () => { Snd.click(); i = n; draw(); };
        dots.append(d);
      });
      box.append(dots);
      const row = el("div", "step-row");
      const back = el("button", "btn btn-ghost", i === 0 ? "В МЕНЮ" : "НАЗАД");
      back.onclick = () => { Snd.click(); if (i === 0) return renderMenu(); i--; draw(); };
      row.append(back);
      if (i < steps.length - 1) {
        const next = el("button", "btn btn-accent", "ДАЛЬШЕ →");
        next.onclick = () => { Snd.click(); i++; draw(); };
        row.append(next);
      } else {
        const proto = el("button", "btn btn-accent", "📋 " + esc(G.protocolTitle || "ПРОТОКОЛ"));
        proto.onclick = () => { Snd.click(); showProtocol(); };
        row.append(proto);
        const done = el("button", "btn", "В МЕНЮ");
        done.onclick = () => { Snd.click(); renderMenu(); };
        row.append(done);
      }
      box.append(row);
      sc.append(box); root.append(sc);
    }
    draw();
  }

  /* Вступление — семь абзацев, целиком не влезали. Показываем по два,
     с возможностью пропустить. */
  function renderIntro() {
    const lines = (G.intro || []).slice();
    const per = 2;
    // страницы по два абзаца, но одинокий последний абзац приклеиваем к предыдущей
    const groups = [];
    for (let n = 0; n < lines.length; n += per) groups.push(lines.slice(n, n + per));
    if (groups.length > 1 && groups[groups.length - 1].length === 1) {
      groups[groups.length - 2] = groups[groups.length - 2].concat(groups.pop());
    }
    const pages = groups.length;
    let p = 0;
    function draw() {
      root.innerHTML = ""; ensureFX();
      const sc = el("div", "screen story");
      const box = el("div", "story-box");
      groups[p].forEach((line, n) => {
        const el2 = el("p", "story-line show", esc(line));
        el2.style.animation = "fade .5s " + (n * 0.12) + "s both";
        box.append(el2);
      });
      const dots = el("div", "step-dots");
      for (let n = 0; n < pages; n++) dots.append(el("i", "dot" + (n === p ? " on" : "")));
      box.append(dots);
      const row = el("div", "step-row");
      if (p > 0) {
        const back = el("button", "btn btn-ghost", "НАЗАД");
        back.onclick = () => { Snd.click(); p--; draw(); };
        row.append(back);
      }
      const last = p >= pages - 1;
      const next = el("button", "btn btn-accent", last ? (L("startShiftLabel", "НАЧАТЬ СМЕНУ")) + " →" : "ДАЛЬШЕ →");
      next.onclick = () => { Snd.click(); if (last) return startDay(); p++; draw(); };
      row.append(next);
      if (!last) {
        const skip = el("button", "btn btn-ghost", "ПРОПУСТИТЬ");
        skip.onclick = () => { Snd.click(); startDay(); };
        row.append(skip);
      }
      box.append(row);
      sc.append(box); root.append(sc);
    }
    draw();
  }

  const currentDay = () => (G.days || [])[state.dayIndex];

  function startDay() {
    const day = currentDay(); if (!day) return renderEnding("win");
    state.caseQueue = day.cases.slice(); state.caseIndex = 0; state.dayStats = { correct: 0, total: 0 };
    state.probesLeft = day.probeBudget != null ? day.probeBudget : (G.probeBudget != null ? G.probeBudget : 3);
    persist(); renderDayIntro(day);
  }

  function renderDayIntro(day) {
    root.innerHTML = ""; ensureFX();
    const sc = el("div", "screen story");
    const box = el("div", "story-box");
    box.append(el("div", "day-badge", `${esc(L("dayWord", "ДЕНЬ"))} ${day.day || state.dayIndex + 1}`));
    if (day.title) box.append(el("h2", "day-title", esc(day.title)));
    if (day.intro) box.append(el("p", "story-line show", esc(day.intro)));
    box.append(el("div", "day-budget", `${esc(L("probeWord", "ЗАПРОСЫ"))} на день: <b>${state.probesLeft}</b> · ${esc(L("probeHint", "тратятся на проверки в реестрах и звонки"))}`));
    const btn = el("button", "btn btn-accent", (L("startShiftLabel", "ЗАСТУПИТЬ НА СМЕНУ")) + " →");
    btn.onclick = () => { Snd.click(); nextCase(); };
    box.append(btn); sc.append(box); root.append(sc);
  }

  function nextCase() {
    if (state.caseIndex >= state.caseQueue.length) return renderDaySummary();
    const c = CASE_BY_ID[state.caseQueue[state.caseIndex]];
    if (!c) { state.caseIndex++; return nextCase(); }
    renderCase(c);
  }

  /* ============================================================
     КЕЙС: досье со вкладками → доска → нить
     ============================================================ */
  function buildRegistry(c) {
    // все адресуемые записи кейса: поля документов + реплики интервью
    const reg = {};
    (c.documents || []).forEach((t) => (t.fields || []).forEach((f) => {
      if (f.id) reg[f.id] = { kind: "field", tab: t.tab, label: f.label, value: f.value, secret: !!f.secret, id: f.id };
    }));
    (c.transcript || []).forEach((ln, i) => {
      if (ln.id) reg[ln.id] = { kind: "line", tab: L("interviewTab", "ИНТЕРВЬЮ"), label: ln.who === "you" ? L("youWord", "ВЫ") : (c.name || "КАНДИДАТ"), value: ln.text, id: ln.id };
    });
    (c.probes || []).forEach((p) => {
      if (p.id && p.evidence) reg[p.id] = { kind: "probe", tab: L("probeTab", "ЗАПРОС"), label: p.label, value: p.evidence, id: p.id, secret: true };
    });
    // ответы на заданные вопросы — такие же записи, как строки документов
    (c.questions || []).forEach((q) => {
      if (q.id) reg[q.id] = { kind: "answer", tab: L("askTab", "ОТВЕТ НА ВОПРОС"), label: q.q, value: q.a, id: q.id, secret: true };
    });
    return reg;
  }

  /* ============================================================
     КЕЙС: папка кандидата + запись интервью.
     Механика — «красная рамка»: игрок отмечает строки и реплики,
     которые считает не сходящимися. Как только отмечено две,
     движок сверяет пару: если это настоящее расхождение, обе
     строки становятся подтверждёнными; если нет — попытка сверки
     сгорает. Пары берутся из c.contradictions, поэтому наугад
     набрать нельзя.
     ============================================================ */
  function renderCase(c) {
    root.innerHTML = ""; ensureFX();
    const sc = el("div", "screen play");
    sc.append(hud());

    const docs = (c.documents || []).map((t) => ({ tab: t.tab || "ДОКУМЕНТ", note: t.note, fields: (t.fields || []).slice() }));
    const reg = buildRegistry(c);
    const contras = (c.contradictions || []).map((x, i) => ({ i: i, a: x.a, b: x.b, note: x.note, key: pairKey(x.a, x.b) }));
    const contraByKey = {}; contras.forEach((x) => (contraByKey[x.key] = x));

    let probeHead = null;
    let askPanel = null;
    const marked = [];                 // id отмеченных красной рамкой
    const found = new Set();           // ключи подтверждённых пар
    const inPair = new Set();           // id строк, вошедших в подтверждённую пару
    const revealed = new Set();        // id открытых по проверке полей
    const usedProbes = new Set();
    const triesTotal = c.checkTries != null ? c.checkTries : (c.threadTries != null ? c.threadTries
      : (G.checkTries != null ? G.checkTries : (G.threadTries != null ? G.threadTries : 4)));
    let triesLeft = triesTotal;
    let decided = false;

    /* ---------- левая колонка: папка кандидата ---------- */
    const dossier = el("div", "col dossier");
    const hasShot = !!FACES[c.id];
    const idCard = el("div", "paper id-card" + (hasShot ? " small-photo" : ""));
    // маленькая аватарка в углу: крупный кадр живёт в окне созвона, но лицо
    // должно быть видно и в папке, когда смотришь документы
    const photo = el("div", hasShot ? "avatar" : "polaroid", faceHTML(c, { tag: "main" }));
    if (!hasShot) photo.append(el("span", "pol-cap", esc(c.role || (c.meta && c.meta[Object.keys(c.meta)[0]]) || "")));
    if (c.avatar) photo.append(el("span", "cat-badge", esc(c.avatar)));
    idCard.append(photo);
    const idInfo = el("div", "id-info");
    idInfo.append(el("div", "cand-name", esc(c.name || "") +
      (hasShot && c.role ? ` <span class="cand-role">${esc(c.role)}</span>` : "")));
    if (c.meta) {
      const meta = el("dl", "meta-grid");
      Object.keys(c.meta).forEach((k) => { meta.append(el("dt", null, esc(k))); meta.append(el("dd", null, esc(c.meta[k]))); });
      idInfo.append(meta);
    }
    idCard.append(idInfo);
    dossier.append(idCard);

    // подсказка + счётчик сверок
    const bar = el("div", "markbar");
    bar.innerHTML = `<span class="mb-hint">${esc(L("markHint", "Обводи красным всё, что кажется подозрительным."))}</span>` +
      `<span class="mb-right"><span class="mb-count">${esc(L("markedWord", "отмечено"))}: <b>0</b></span>` +
      `<span class="mb-tries"><b>${triesLeft}</b> ${esc(L("triesWord", "сверок"))}</span></span>`;
    // сверка — отдельное осознанное действие: отмечать можно сколько угодно,
    // а сверяются ровно две выбранные строки
    const checkBtn = el("button", "btn btn-sm check-btn", esc(L("checkLabel", "СВЕРИТЬ ОТМЕЧЕННОЕ")));
    checkBtn.disabled = true;
    checkBtn.onclick = () => { Snd.click(); checkPair(); };
    bar.querySelector(".mb-right").append(checkBtn);
    dossier.append(bar);

    // вкладки документов
    const folder = el("div", "folder");
    const tabsRow = el("div", "tabs");
    const pane = el("div", "doc-pane");
    let activeTab = 0;
    docs.forEach((t, di) => {
      const tb = el("button", "tab" + (di === 0 ? " active" : ""), esc(t.tab));
      tb.onclick = () => {
        Snd.page(); activeTab = di;
        tabsRow.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
        tb.classList.add("active"); paintPane();
      };
      tabsRow.append(tb);
    });

    function fieldVisible(f) { return !f.secret || revealed.has(f.id); }
    function stateOf(id) { return inPair.has(id) ? " confirmed" : (marked.indexOf(id) >= 0 ? " marked" : ""); }

    function paintPane() {
      const t = docs[activeTab];
      pane.innerHTML = "";
      pane.append(el("div", "doc-head", `<span class="doc-stamp">${esc(t.tab)}</span>` + (t.note ? `<span class="doc-note">${esc(t.note)}</span>` : "")));
      let shown = 0;
      t.fields.forEach((f) => {
        if (!fieldVisible(f)) return;
        shown++;
        const row = el("div", "doc-row" + (f.id ? " markable" : "") + (f.secret ? " fresh" : "") + (f.id ? stateOf(f.id) : ""));
        row.append(el("span", "doc-label", esc(f.label)));
        row.append(el("span", "doc-value", esc(f.value)));
        if (f.id) {
          row.dataset.id = f.id;
          row.onclick = () => toggleMark(f.id);
        }
        pane.append(row);
      });
      if (!shown) pane.append(el("div", "doc-empty", esc(L("emptyDoc", "Пусто. Похоже, тут нужна проверка."))));
      pane.classList.remove("swap"); void pane.offsetWidth; pane.classList.add("swap");
    }
    folder.append(tabsRow, pane);
    dossier.append(folder);

    // проверки (звонки, реестры, ЕГРЮЛ) — слева, рядом с документами
    if (c.probes && c.probes.length) {
      const pb = el("div", "paper probes");
      pb.innerHTML = `<div class="probes-head">${esc(L("probeTitle", "ПРОВЕРКИ (тратят дневной лимит)"))} <b>${state.probesLeft}</b></div>`;
      const list = el("div", "probe-list");
      c.probes.forEach((p) => {
        const b = el("button", "probe-btn", `<span class="pb-label">${esc(p.label)}</span><span class="pb-cost">−${p.cost || 1}</span>`);
        b.onclick = () => {
          if (usedProbes.has(p.id) || decided) return;
          const cost = p.cost || 1;
          if (state.probesLeft < cost) { toast(L("noProbes", "Лимит проверок на сегодня исчерпан."), "warn"); return; }
          state.probesLeft -= cost; usedProbes.add(p.id);
          if (probeHead) probeHead.textContent = state.probesLeft;
          Snd.probe();
          (p.reveals || []).forEach((fid) => revealed.add(fid));
          if (p.evidence) revealed.add(p.id);
          b.classList.add("used"); b.innerHTML = `<span class="pb-label">${esc(p.label)}</span><span class="pb-done">✓</span>`;
          const res = el("div", "probe-result", `<b>${esc(L("probeAnswer", "ОТВЕТ"))}:</b> ${esc(p.result || p.evidence || "")}`);
          list.insertBefore(res, b.nextSibling);
          // ответ проверки — тоже строка, которую можно отметить рамкой
          if (p.evidence) {
            res.classList.add("markable");
            res.dataset.id = p.id;
            res.onclick = () => toggleMark(p.id);
            res.append(el("span", "pr-mark", esc(L("markThis", "отметить"))));
            res.className = "probe-result markable" + stateOf(p.id);
          }
          refreshHudProbes(); paintPane();
        };
        list.append(b);
      });
      pb.append(list);
      probeHead = pb.querySelector(".probes-head b");
      dossier.append(pb);
    }

    /* ---------- вопросы кандидату ----------
       Игрок сам ведёт часть интервью: вопросов на выбор больше, чем можно
       задать, поэтому приходится решать, что важнее спросить. Ответ попадает
       в запись как обычная реплика — его можно обвести и сверить с документом. */
    let asksLeft = c.askLimit != null ? c.askLimit : (G.askLimit != null ? G.askLimit : 2);
    if (c.questions && c.questions.length) {
      const qp = el("div", "paper asks");
      qp.innerHTML = `<div class="asks-head"><span>${esc(L("askTitle", "СПРОСИТЬ КАНДИДАТА"))}</span>` +
        `<span class="asks-left">${esc(L("askLeftWord", "осталось"))} <b>${asksLeft}</b></span></div>`;
      const counter = qp.querySelector(".asks-left b");
      const list = el("div", "ask-list");
      c.questions.forEach((q) => {
        const b = el("button", "ask-btn", `<span class="ask-q">${esc(q.q)}</span>` +
          (q.tag ? `<span class="ask-tag">${esc(q.tag)}</span>` : ""));
        b.onclick = () => {
          if (decided || b.classList.contains("used")) return;
          if (asksLeft <= 0) { toast(L("noAsks", "Вопросы на этого кандидата закончились."), "warn"); return; }
          asksLeft--; counter.textContent = asksLeft;
          b.classList.add("used");
          revealed.add(q.id);
          Snd.click();
          addBubble({ who: "you", text: q.q });
          setTimeout(() => { addBubble({ who: "caller", text: q.a, id: q.id }); }, 420);
          if (asksLeft <= 0) qp.querySelectorAll(".ask-btn:not(.used)").forEach((x) => x.classList.add("off"));
        };
        list.append(b);
      });
      qp.append(list);
      askPanel = qp;                      // повесим в правую колонку, под запись интервью
    }

    /* ---------- правая колонка: интервью + найденное ---------- */
    const right = el("div", "col talk");
    const tp = el("div", "paper talk-paper");
    tp.append(el("div", "paper-head", `<span class="rec"></span>${esc(c.channelTitle || G.channelTitle || "ИНТЕРВЬЮ")}`));
    if (c.audioCues && c.audioCues.length) {
      const cues = el("div", "cues");
      cues.append(el("div", "cues-head", esc(G.audioTitle || "ПОМЕТКИ")));
      c.audioCues.forEach((a) => cues.append(el("div", "cue", "— " + esc(a))));
      tp.append(cues);
    }
    const feed = el("div", "feed"); tp.append(feed);
    right.append(tp);

    if (askPanel) right.append(askPanel);

    const findings = el("div", "findings");
    findings.append(el("div", "fd-head", esc(L("findingsTitle", "ПОДТВЕРЖДЁННЫЕ НЕСТЫКОВКИ"))));
    const fdList = el("div", "fd-list");
    fdList.append(el("div", "fd-empty", esc(L("findingsEmpty", "Пока ни одной нестыковки не подтверждено."))));
    findings.append(fdList);
    right.append(findings);

    const stage = el("div", "stage two-col");
    stage.append(dossier, right);
    sc.append(stage);

    /* ---------- действия ---------- */
    const actions = el("div", "actions");
    const reject = el("button", "btn btn-danger big", esc(G.rejectLabel || "ОТКАЗАТЬ"));
    const accept = el("button", "btn btn-ok big", esc(G.acceptLabel || "ПРИГЛАСИТЬ"));
    accept.disabled = reject.disabled = true;
    accept.onclick = () => finish(true);
    reject.onclick = () => {
      if (found.size === 0) {
        confirmOverlay(L("noProofTitle", "ОТКАЗАТЬ БЕЗ ОСНОВАНИЙ?"),
          L("noProofText", "Ни одной нестыковки не подтверждено."),
          () => finish(false, true));
      } else finish(false);
    };
    actions.append(reject, accept);
    sc.append(actions);
    root.append(sc);

    /* ---------- отметка рамкой и сверка пары ---------- */
    function refreshHudProbes() { const b = $(".hud-probes b"); if (b) b.textContent = state.probesLeft; }
    function refreshTries() {
      const b = bar.querySelector(".mb-tries b");
      if (b) { b.textContent = triesLeft; b.parentElement.classList.toggle("low", triesLeft <= 1); }
    }
    function repaintMarks() {
      const cnt = bar.querySelector(".mb-count b");
      if (cnt) cnt.textContent = marked.length;
      const cb = bar.querySelector(".check-btn");
      if (cb) {
        cb.disabled = marked.length !== 2 || triesLeft <= 0 || decided;
        cb.classList.toggle("ready", marked.length === 2 && triesLeft > 0);
      }
      // строки живут по id, а не по DOM: отметка сохраняется при смене вкладки
      root.querySelectorAll("[data-id]").forEach((n) => {
        const id = n.dataset.id;
        n.classList.toggle("marked", marked.indexOf(id) >= 0);
        n.classList.toggle("confirmed", inPair.has(id));
      });
    }

    function toggleMark(id) {
      if (decided) return;
      const entry = reg[id];
      if (!entry) return;
      if (entry.secret && !revealed.has(id)) return;
      // одна и та же строка может расходиться сразу с несколькими другими,
      // поэтому подтверждённую строку разрешено отмечать снова
      const at = marked.indexOf(id);
      if (at >= 0) { marked.splice(at, 1); Snd.unpin(); repaintMarks(); return; }
      marked.push(id); Snd.pin(); repaintMarks();
    }

    function checkPair() {
      if (marked.length !== 2) {
        toast(marked.length < 2
          ? L("needTwo", "Отметь две строки, которые, по-твоему, противоречат друг другу.")
          : L("tooMany", "Для сверки нужно ровно две отметки — сними лишние."), "warn");
        return;
      }
      if (triesLeft <= 0) { toast(L("triesOut", "Сверки на этого кандидата закончились."), "warn"); return; }
      const a = marked[0], b = marked[1];
      const key = pairKey(a, b);
      if (found.has(key)) { marked.length = 0; repaintMarks(); return; }
      const hit = contraByKey[key];
      if (hit) {
        found.add(key); inPair.add(a); inPair.add(b);
        marked.length = 0;
        Snd.thread(); flash("ok");
        rebuildFindings(); repaintMarks();
        toast(L("pairHold", "Сходится: эти два факта друг другу противоречат."), "ok");
      } else {
        triesLeft--;
        // отметки оставляем: обычно игрок хочет поменять одну строку в паре
        Snd.snap(); flash("bad");
        [a, b].forEach((id) => {
          const n = root.querySelector('[data-id="' + cssEsc(id) + '"]');
          if (n) { n.classList.add("shake-row"); setTimeout(() => n.classList.remove("shake-row"), 420); }
        });
        repaintMarks(); refreshTries();
        toast(triesLeft > 0
          ? (L("pairSnap", "Здесь расхождения нет: эти строки друг другу не противоречат.") + " " + L("triesLeftWord", "Осталось сверок:") + " " + triesLeft)
          : L("triesOut", "Сверки закончились. Дальше — только твоё решение."), "bad");
      }
    }

    function rebuildFindings() {
      fdList.innerHTML = "";
      if (!found.size) { fdList.append(el("div", "fd-empty", esc(L("findingsEmpty", "Пока ни одной нестыковки не подтверждено.")))); return; }
      [...found].forEach((k) => {
        const x = contraByKey[k];
        const a = reg[x.a], b = reg[x.b];
        const li = el("div", "fd-item");
        li.innerHTML = `<span class="fd-pair">${esc(a ? a.tab + " · " + a.label : x.a)} ⟷ ${esc(b ? b.tab + " · " + b.label : x.b)}</span>` +
          `<span class="fd-note">${esc(x.note || "")}</span>`;
        fdList.append(li);
      });
      fdList.scrollTop = fdList.scrollHeight;
    }
    const cssEsc = (s) => String(s).replace(/["\\]/g, "\\__ENGINE__");

    /* ---------- интервью ---------- */
    const faceEls = [...sc.querySelectorAll(".avatar .shot, .avatar .riso, .polaroid .riso")];
    const faceOn = (on) => faceEls.forEach((n) => n.classList.toggle("talking", on));
    const lines = (c.transcript || []).slice();
    let li = 0;
    function addBubble(ln) {
      const who = ln.who || "caller";
      const bub = el("div", "bubble " + who + (ln.id ? " markable" + stateOf(ln.id) : ""));
      if (ln.id) { bub.dataset.id = ln.id; bub.onclick = () => toggleMark(ln.id); }
      bub.append(el("div", "who", esc(labelFor(who, c))));
      bub.append(el("div", "txt", esc(ln.text)));
      feed.append(bub); feed.scrollTop = feed.scrollHeight;
      Snd.blip();
    }
    function unlock() {
      accept.disabled = reject.disabled = false; actions.classList.add("ready");
      // запись доиграла сама — кнопка «показать всю запись» больше не нужна
      if (skip && skip.parentNode) skip.remove();
    }
    function playLine() {
      faceOn(false);
      if (li >= lines.length) return unlock();
      const ln = lines[li++], who = ln.who || "caller";
      if (who === "system") { addBubble(ln); return setTimeout(playLine, 520); }
      const typ = el("div", "bubble " + who + " typing", "<span></span><span></span><span></span>");
      feed.append(typ); feed.scrollTop = feed.scrollHeight;
      if (who === "caller") faceOn(true);
      Snd.type();
      const dur = clamp((ln.text || "").length * 9, 260, 780);
      setTimeout(() => {
        typ.remove(); addBubble(ln);
        setTimeout(playLine, clamp((ln.text || "").length * 10, 200, 700));
      }, dur);
    }
    setTimeout(playLine, 320);
    const skip = el("button", "btn btn-ghost btn-sm skip", "⏩ показать всю запись");
    skip.onclick = () => {
      Snd.click();
      while (li < lines.length) addBubble(lines[li++]);
      faceOn(false);
      feed.scrollTop = feed.scrollHeight; unlock(); skip.remove();
    };
    tp.append(skip);

    /* ---------- завершение кейса ---------- */
    function finish(accepted, blind) {
      if (decided) return; decided = true;
      accepted ? Snd.good() : Snd.bad();
      // доступной считается пара, у которой обе строки открыты: часть нестыковок
      // видна только после вопроса или проверки, а лимиты не дают вскрыть всё
      const closed = (id) => reg[id] && reg[id].secret && !revealed.has(id);
      const reachable = contras.filter((x) => !closed(x.a) && !closed(x.b)).length;
      decide(c, accepted, {
        found: found.size, provable: reachable, total: contras.length,
        wasted: triesTotal - triesLeft, blind: !!blind, contras: contras, reg: reg,
        closed: closed, probesUsed: usedProbes.size, foundKeysSet: found
      });
    }

    paintPane(); refreshTries();

    /* хук для e2e-драйвера: тот же путь, что у мышки, но без координат */
    window.GAME.current = {
      id: c.id, isImposter: c.isImposter, contras: contras,
      ready: () => !accept.disabled,
      mark: (fid) => toggleMark(fid),
      check: (a, b) => { marked.length = 0; repaintMarks(); toggleMark(a); toggleMark(b); checkPair(); },
      marksLeft: () => marked.slice(),
      probeAll: () => dossier.querySelectorAll(".probe-btn:not(.used)").forEach((b) => b.click()),
      askAll: () => dossier.querySelectorAll(".ask-btn:not(.used):not(.off)").forEach((b) => b.click()),
      asksLeft: () => asksLeft,
      marked: () => marked.slice(),
      hidden: () => Object.keys(reg).filter((k) => reg[k].secret && !revealed.has(k)),
      found: () => found.size,
      tries: () => triesLeft,
      decide: (acc) => (acc ? accept : reject).click()
    };
  }

  function labelFor(who, c) {
    const S = G.speakerLabels || {};
    if (who === "you") return S.you || "ВЫ";
    if (who === "system") return S.system || "СИСТЕМА";
    return S.caller || (c && c.name) || "КАНДИДАТ";
  }

  /* ---------------- Оверлеи ---------------- */
  function overlayShell(cls) {
    const ov = el("div", "overlay " + (cls || ""));
    const card = el("div", "overlay-card");
    ov.append(card);
    ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
    (root.querySelector(".screen") || root).append(ov);
    return { ov, card };
  }
  /* Протокол — девять длинных пунктов. Показываем свёрнутыми: заголовок
     пункта виден всегда, текст раскрывается по клику. */
  function showProtocol() {
    const { ov, card } = overlayShell("proto");
    card.append(el("h3", null, esc(G.protocolTitle || "ПРОТОКОЛ")));
    const list = el("div", "acc");
    (G.protocol || []).forEach((line) => {
      const m = String(line).match(/^(\s*\d+\.\s*[^.:]+[.:])\s*([\s\S]*)$/);
      const head = m ? m[1].trim() : String(line).slice(0, 40) + "…";
      const body = m ? m[2].trim() : String(line);
      const d = el("details", "acc-item");
      d.innerHTML = `<summary>${esc(head)}</summary><div class="acc-body">${esc(body)}</div>`;
      list.append(d);
    });
    card.append(list);
    const close = el("button", "btn btn-accent", "ЗАКРЫТЬ");
    close.onclick = () => { Snd.click(); ov.remove(); };
    card.append(close);
  }
  function confirmOverlay(title, text, onYes) {
    if ($(".overlay")) return;            // не стакать оверлеи на повторных кликах
    const { ov, card } = overlayShell("confirm");
    card.append(el("h3", null, esc(title)));
    card.append(el("p", null, esc(text)));
    const row = el("div", "ov-row");
    const no = el("button", "btn btn-ghost", L("backWord", "ВЕРНУТЬСЯ К ПРОВЕРКЕ"));
    no.onclick = () => { Snd.click(); ov.remove(); };
    const yes = el("button", "btn btn-danger", L("anywayWord", "ВСЁ РАВНО ОТКЛОНИТЬ"));
    yes.onclick = () => { ov.remove(); onYes(); };
    row.append(no, yes); card.append(row);
  }
  let toastT = null;
  function toast(msg, kind) {
    let t = $(".toast");
    if (!t) { t = el("div", "toast"); (root.querySelector(".screen") || root).append(t); }
    t.className = "toast show " + (kind || "");
    t.textContent = msg;
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.className = "toast " + (kind || ""); }, 2600);
  }
  function flash(kind) {
    document.body.classList.add("flash-" + kind);
    setTimeout(() => document.body.classList.remove("flash-" + kind), 260);
  }

  /* ---------------- Решение и вердикт ---------------- */
  function gradeFor(info, correct) {
    if (!correct) return "F";
    if (info.provable === 0) return info.wasted === 0 ? "A" : (info.wasted <= 1 ? "B" : "C");
    const ratio = info.found / info.provable;
    if (info.blind || info.found === 0) return "D";
    if (ratio === 1 && info.wasted === 0) return "A";
    if (ratio >= 0.99) return "B";
    if (ratio >= 0.5) return "B";
    return "C";
  }

  function decide(c, accepted, info) {
    const correct = accepted ? !c.isImposter : c.isImposter;
    state.total++; state.dayStats.total++;
    state.proved += info.found; state.provable += info.provable; state.wasted += info.wasted;
    const grade = gradeFor(info, correct);
    state.grades.push(grade);
    if (correct) {
      state.correct++; state.dayStats.correct++;
      state.combo++; state.bestCombo = Math.max(state.bestCombo, state.combo);
      if (state.combo >= 2) Snd.combo(state.combo);
    } else {
      state.combo = 0;
      if (c.isImposter) state.wolves++; else state.unfair++;
    }
    persist();
    const fatal = !correct && c.isImposter;
    if (fatal) renderJumpscare(() => renderVerdict(c, accepted, correct, info, grade));
    else renderVerdict(c, accepted, correct, info, grade);
  }

  function renderJumpscare(done) {
    Snd.scare();
    const js = el("div", "jumpscare");
    // в джампскейре — лицо того, кого пропустили, если оно есть
    const last = CASE_BY_ID[state.caseQueue[state.caseIndex]];
    js.innerHTML = (G.scareArt || "") + (last && FACES[last.id]
      ? `<img class="shot glitch" src="${FACES[last.id]}" alt="">`
      : Portrait.svg({ id: "wolf" + state.total, name: "Х", expression: "smug", face: { paper: "#1a1512", ink: "#d8d2c6", spot: "#b4322f", hairStyle: 4 } }, { glitch: true, tag: "js" }));
    js.append(el("div", "js-text", esc(G.scareText || "ОНО ВНУТРИ.")));
    root.append(js);
    if (navigator.vibrate) try { navigator.vibrate([70, 40, 130]); } catch (e) {}
    setTimeout(() => { js.remove(); done(); }, 1250);
  }

  function renderVerdict(c, accepted, correct, info, grade) {
    root.innerHTML = ""; ensureFX();
    const sc = el("div", "screen verdict " + (correct ? "good" : "bad"));
    const box = el("div", "verdict-box");

    const top = el("div", "v-top");
    const pv = el("div", "polaroid v-photo" + (c.isImposter ? " imp" : ""),
      faceHTML({ id: c.id, name: c.name, face: c.face, expression: c.isImposter ? "smug" : "warm" }, { glitch: c.isImposter, tag: "v" }));
    top.append(pv);
    const tw = el("div", "v-words");
    tw.append(el("div", "v-name", esc(c.name || "")));
    const truth = c.isImposter ? (G.imposterWord || "САМОЗВАНЕЦ") : (G.legitWord || "НАСТОЯЩИЙ");
    tw.append(el("div", "verdict-truth", `${esc(G.truthPrefix || "Это был:")} <b>${esc(truth)}</b>`));
    tw.append(el("div", "v-choice", esc((accepted ? (G.acceptLabel || "ПРИНЯТЬ") : (G.rejectLabel || "ОТКЛОНИТЬ")) + (info.blind ? " · " + L("blindWord", "без доказательств") : ""))));
    top.append(tw);
    const stamp = el("div", "stamp " + (correct ? "s-ok" : "s-bad"), correct ? (G.correctTag || "ВЕРНО") : (G.wrongTag || "ОШИБКА"));
    top.append(stamp);
    box.append(top);

    // всё, кроме шапки и кнопки, живёт в прокручиваемой области
    const scroll = el("div", "verdict-scroll");
    box.append(scroll);
    let msg = correct ? (c.feedbackCorrect || G.defaultCorrect) : (c.feedbackWrong || G.defaultWrong);
    if (msg) scroll.append(el("p", "verdict-msg", esc(msg)));

    // разбор: все противоречия кейса — найденные и пропущенные
    if ((info.total || info.provable) > 0) {
      const wrap = el("div", "tells");
      wrap.append(el("div", "tells-head", esc(G.tellsTitle || "ПРОТИВОРЕЧИЯ В ДЕЛЕ:")));
      const ul = el("ul", "clue-list");
      info.contras.forEach((x) => {
        const a = info.reg[x.a], b = info.reg[x.b];
        const isFound = (info.foundKeysSet && info.foundKeysSet.has(x.key));
        const wasClosed = !isFound && info.closed && (info.closed(x.a) || info.closed(x.b));
        const liEl = el("li", "clue " + (isFound ? "hit" : (wasClosed ? "locked" : "miss")));
        liEl.innerHTML = `<span class="clue-mark">${isFound ? "✔" : (wasClosed ? "🔒" : "✕")}</span>
          <span class="clue-where"><b>${esc(a ? a.tab + " · " + a.label : x.a)}</b>: ${esc(a ? a.value : "")}<br>
          <b>${esc(b ? b.tab + " · " + b.label : x.b)}</b>: ${esc(b ? b.value : "")}</span>
          <span class="clue-note">${esc(x.note || "")}</span>`;
        ul.append(liEl);
      });
      wrap.append(ul);
      const lockedCount = (info.total || 0) - info.provable;
      wrap.append(el("div", "accuracy", `${esc(L("provedWord", "Подтверждено"))}: <b>${info.found}/${info.provable}</b>` +
        (lockedCount > 0 ? ` · <span class="locked-note">${esc(L("lockedWord", "ещё"))} ${lockedCount} ${esc(L("lockedTail", "открывались вопросом или проверкой"))}</span>` : "") +
        (info.wasted ? ` · <span class="miss">${esc(L("wastedWord", "порвано нитей"))}: ${info.wasted}</span>` : "") +
        (info.found === info.provable ? ` · <span class="hit">${esc(L("cleanWord", "дело собрано чисто"))}</span>` : "")));
      scroll.append(wrap);
    } else if (c.herrings && c.herrings.length) {
      const wrap = el("div", "tells calm");
      wrap.append(el("div", "tells-head", esc(L("herringTitle", "ЧТО ВЫГЛЯДЕЛО ПОДОЗРИТЕЛЬНО, НО БЫЛО В НОРМЕ:"))));
      const ul = el("ul", "reader-list"); c.herrings.forEach((x) => ul.append(el("li", null, esc(x))));
      wrap.append(ul);
      if (info.wasted) wrap.append(el("div", "accuracy", `<span class="miss">${esc(L("wastedWord", "неверных сверок"))}: ${info.wasted} — здесь расхождений не было.</span>`));
      scroll.append(wrap);
    }

    const gr0 = el("div", "grade g-" + grade, `<span class="g-l">${esc(L("gradeWord", "ОЦЕНКА КЕЙСА"))}</span><span class="g-v">${grade}</span>`);
    scroll.append(gr0);
    if (correct && state.combo >= 3) scroll.append(el("div", "combo-note", `серия ×${state.combo} — ты в ритме`));

    const btn = el("button", "btn btn-accent", "ДАЛЕЕ →");
    btn.onclick = () => {
      Snd.click();
      const M = METERS();
      if (state.wolves >= M.wolves.max) return renderEnding("loseWolves");
      if (state.unfair >= M.unfair.max) return renderEnding("loseUnfair");
      state.caseIndex++; nextCase();
    };
    box.append(btn); sc.append(box); root.append(sc);
    setTimeout(() => { stamp.classList.add("hit"); Snd.stamp(); document.body.classList.add("thunk"); setTimeout(() => document.body.classList.remove("thunk"), 420); }, 160);
  }

  function renderDaySummary() {
    root.innerHTML = ""; ensureFX();
    const day = currentDay();
    const sc = el("div", "screen story");
    const box = el("div", "story-box");
    box.append(el("div", "day-badge", `${esc(L("dayEndWord", "КОНЕЦ ДНЯ"))} ${day.day || state.dayIndex + 1}`));
    const s = state.dayStats;
    box.append(el("div", "day-score", `${s.correct} / ${s.total}`));
    box.append(el("p", "story-line show", esc(scoreComment(s.correct, s.total))));
    if (day.outro) box.append(el("p", "story-line show", esc(day.outro)));
    const last = state.dayIndex >= G.days.length - 1;
    const btn = el("button", "btn btn-accent", last ? "ЗАВЕРШИТЬ →" : (L("nextDayLabel", "СЛЕДУЮЩИЙ ДЕНЬ")) + " →");
    btn.onclick = () => { Snd.click(); if (last) return renderEnding("win"); state.dayIndex++; persist(); startDay(); };
    box.append(btn); sc.append(box); root.append(sc);
  }

  function scoreComment(c, t) {
    if (!t) return "";
    const r = c / t;
    if (r === 1) return G.dayPerfect || "Ни одной ошибки.";
    if (r >= 0.7) return G.dayGood || "Почти чисто.";
    return G.dayBad || "Слишком много прошло мимо.";
  }

  function rankFor() {
    const ranks = G.ranks || ["НОВИЧОК", "СПЕЦИАЛИСТ", "ПРОФИ", "ЛЕГЕНДА"];
    const acc = state.total ? state.correct / state.total : 0;
    const proof = state.provable ? state.proved / state.provable : 1;
    const score = acc * 0.65 + proof * 0.35;
    return ranks[clamp(Math.floor(score * ranks.length - 0.0001), 0, ranks.length - 1)];
  }

  function renderEnding(which) {
    const e = (G.endings || {})[which] || (G.endings || {}).lose || {};
    if (which === "win") { const sv = loadSave() || {}; sv.finished = true; writeSave(sv); } else clearSave();
    root.innerHTML = ""; ensureFX();
    const sc = el("div", "screen story ending " + (which === "win" ? "win" : "lose"));
    const box = el("div", "story-box");
    box.append(el("h2", "ending-title", esc(e.title || (which === "win" ? "СМЕНА ЗАКРЫТА" : "КОНЕЦ"))));
    (Array.isArray(e.text) ? e.text : [e.text || ""]).forEach((t) => t && box.append(el("p", "story-line show", esc(t))));
    box.append(el("div", "final-score",
      `${esc(L("resultWord", "Итог"))}: ${state.correct}/${state.total} · ` +
      `${esc(L("provedWord", "доказано"))} ${state.proved}/${state.provable} · ` +
      `${esc(L("bestComboWord", "лучшая серия"))} ×${state.bestCombo}`));
    const gcount = {}; state.grades.forEach((g) => (gcount[g] = (gcount[g] || 0) + 1));
    box.append(el("div", "grade-strip", ["A", "B", "C", "D", "F"].map((g) => `<span class="gs g-${g}">${g}<b>${gcount[g] || 0}</b></span>`).join("")));
    if (which === "win") box.append(el("div", "rank-badge", `${esc(L("rankWord", "РАНГ"))}: ${esc(rankFor())}`));
    const again = el("button", "btn btn-accent", "В МЕНЮ"); again.onclick = () => { Snd.click(); go("menu"); };
    box.append(again); sc.append(box); root.append(sc);
  }

  function persist() {
    writeSave({ dayIndex: state.dayIndex, wolves: state.wolves, unfair: state.unfair, correct: state.correct, total: state.total, proved: state.proved, provable: state.provable, wasted: state.wasted, finished: false });
  }
  function go(screen) { if (screen === "menu") return renderMenu(); }

  /* Отладочный хук для e2e-драйвера */
  window.GAME = {
    state: state,
    caseById: CASE_BY_ID,
    solve: function () {
      // возвращает подсказку для автотеста: id кейса и его противоречия
      const c = CASE_BY_ID[state.caseQueue[state.caseIndex]];
      return c ? { id: c.id, isImposter: c.isImposter, contradictions: c.contradictions || [] } : null;
    }
  };

  applyTheme(); ensureFX();
  window.addEventListener("pointerdown", () => { Snd.unlock(); }, { once: true });
  renderMenu();
})();

</script>
</body>
</html>
